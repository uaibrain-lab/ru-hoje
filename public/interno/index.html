<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#fff;--bg2:#f2f4f7;--ink:#101828;--mut:#667085;--line:#e4e7ec;--sh:0 8px 30px rgba(16,24,40,.2)}
@media(prefers-color-scheme:dark){:root{--bg:#14181f;--bg2:#1e242d;--ink:#f5f7fa;--mut:#9aa6b6;--line:#2b333e}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:16px/1.4 "Atkinson Hyperlegible",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #2e90fa;outline-offset:2px}
.ic{width:20px;height:20px;flex:none}
#map{position:fixed;inset:0}
/* Layout P2: o mapa e o elemento principal; a barra inferior se abre sob demanda. */
#top{position:fixed;z-index:500;top:env(safe-area-inset-top,0px);left:0;padding:10px}
.fab{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:9px 13px;background:var(--bg);color:var(--ink);font-size:14px;font-weight:700;box-shadow:var(--sh)}
.fab .ic{width:18px;height:18px}
.btn{border:0;border-radius:999px;padding:11px 15px;background:var(--ink);color:var(--bg);font-weight:700}
#sheet{position:fixed;z-index:500;left:0;right:0;bottom:0;height:min(42dvh,360px);max-height:calc(100dvh - 75px);display:flex;flex-direction:column;overflow:hidden;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;box-shadow:0 -5px 24px rgba(16,24,40,.13);transition:height .23s ease}
#sheet.peek{height:calc(82px + env(safe-area-inset-bottom,0px))}
#sheet.detail:not(.peek){height:min(55dvh,480px)}
#sheet.full,#sheet.detail.full{height:min(82dvh,calc(100dvh - 75px))}
#grab{display:block;flex:none;z-index:2;width:100%;height:16px;border:0;background:var(--bg);padding:0;touch-action:pan-y}
#grab::after{content:"";display:block;width:38px;height:4px;border-radius:3px;background:var(--mut);opacity:.5;margin:5px auto 0}
.sheet-head{display:flex;align-items:center;gap:8px;flex:none;padding:3px 10px 9px 14px;min-height:54px}
.sheet-identity{min-width:0;flex:0 0 auto;display:flex;flex-direction:column;gap:0;line-height:1.15}
.sheet-identity strong{font-size:16px;letter-spacing:-.35px}
.sheet-identity span{color:var(--mut);font-size:10px;font-weight:700;letter-spacing:.65px}
.quick-tabs{display:flex;flex:1;min-width:0;justify-content:flex-end;gap:4px}
.quick-tabs button{border:1px solid var(--line);border-radius:999px;padding:7px 11px;min-height:34px;background:var(--bg2);font-weight:700;font-size:13px;white-space:nowrap}
.quick-tabs button.on{background:var(--ink)!important;color:var(--bg)!important}
.sheet-toggle{flex:none;display:grid;place-items:center;width:35px;height:35px;border:1px solid var(--line);border-radius:50%;background:var(--bg2)}
.sheet-toggle svg{width:18px;height:18px;transition:transform .23s}
#sheet:not(.peek) .sheet-toggle svg{transform:rotate(180deg)}
#body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:7px 13px calc(16px + env(safe-area-inset-bottom,0px));scrollbar-width:thin}
#sheet.peek #body{visibility:hidden;pointer-events:none;overflow:hidden}
@media(max-width:360px){.sheet-head{gap:5px;padding-left:10px;padding-right:7px}.sheet-identity strong{font-size:14px}.quick-tabs button{padding:7px 8px;font-size:12px}.sheet-toggle{width:32px;height:32px}}
@media(min-width:760px){#sheet,#sheet.peek,#sheet.detail:not(.peek){left:14px;top:76px;bottom:14px;right:auto;width:min(346px,calc(100vw - 80px));height:auto;max-height:none;border:1px solid var(--line);border-radius:19px}#grab{display:none}#body,#sheet.peek #body{visibility:visible;pointer-events:auto;overflow-y:auto;padding-top:9px}.sheet-toggle{display:none}.sheet-head{padding-top:12px}}
@media(prefers-reduced-motion:reduce){#sheet,.sheet-toggle svg{transition:none}}
/* Fallback quando o Leaflet externo estiver indisponível: horários permanecem navegáveis. */
body.no-map #map{display:none}
body.no-map #sheet,body.no-map #sheet.peek,body.no-map #sheet.detail:not(.peek){position:fixed;top:65px;bottom:0;left:0;right:0;width:100%;height:calc(100dvh - 65px);max-height:none;transition:none;box-shadow:none;border-radius:18px 18px 0 0}
body.no-map #grab,body.no-map .sheet-toggle{display:none}
body.no-map #body,body.no-map #sheet.peek #body{visibility:visible;pointer-events:auto;overflow-y:auto}
@media(min-width:760px){body.no-map #sheet,body.no-map #sheet.peek,body.no-map #sheet.detail:not(.peek){left:0;right:0;top:65px;bottom:0;width:min(720px,100%);height:calc(100dvh - 65px);margin:auto;border-radius:18px 18px 0 0}}

h1{font-size:24px;margin:0}h2{font-size:21px;margin:0;line-height:1.2}h3{font-size:16px;margin:18px 0 8px}
small{color:var(--mut);font-size:13px;line-height:1.3}
.note{color:var(--mut);font-size:13px;margin:12px 0 0}
i{font-style:normal;font-size:14px;font-weight:400}
.back{display:flex;align-items:center;gap:4px;border:0;background:none;padding:2px 0 10px;font-weight:700;color:var(--mut)}
.row,.next{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;margin:0 0 8px}
.row{background:var(--bg2);border-radius:12px;padding:8px 10px;border-left:4px solid var(--c,transparent);min-height:54px}
.next{background:var(--c);color:#fff;border-radius:20px;padding:14px;margin-bottom:12px}
.next small{color:#ffffffe0}.next .num{background:#ffffff38!important;width:56px;height:56px;font-size:30px}.next .eta b{font-size:36px;line-height:1}.next .eta i{color:#fff}
.num{flex:none;width:44px;height:44px;border-radius:12px;color:#fff;display:grid;place-items:center;font-weight:700;font-size:22px}
.pin{flex:none;width:14px;height:14px;border-radius:50%;border:3px solid var(--ink);margin:0 15px}
.info{flex:1;min-width:0}.info b{display:block}
.eta{flex:none;text-align:right}.eta b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}.eta small{display:block}
.on{background:var(--ink)!important;color:var(--bg)!important;border-color:var(--ink)!important}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chips button{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:14px}
.srch{display:flex;align-items:center;gap:8px;background:var(--bg2);border-radius:12px;padding:0 12px;margin:0 0 10px}
.srch input{flex:1;min-width:0;font:inherit;border:0;background:none;color:var(--ink);padding:10px 0;outline:none}
.srch:focus-within{outline:2px solid var(--ink)}
.hd2{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.star{flex:none;border:0;background:var(--bg2);border-radius:50%;width:44px;height:44px;display:grid;place-items:center;color:var(--mut)}.star.fav{color:#f79009}
.band{display:flex;gap:12px;align-items:center;background:var(--c);color:#fff;border-radius:20px;padding:14px;margin:0 0 4px}
.band small{color:#ffffffe0}.band .num{background:#ffffff38;width:56px;height:56px;font-size:30px}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.t{padding:7px 10px;border-radius:9px;background:var(--bg2);font-variant-numeric:tabular-nums}
.t.past{opacity:.4;text-decoration:line-through}.t.next{background:var(--c);color:#fff;font-weight:700}
.tl{margin:0}
.stp{display:flex;align-items:center;gap:12px;position:relative;width:100%;border:0;background:none;text-align:left;padding:10px 0}
.stp::before{content:"";position:absolute;left:7px;top:0;bottom:0;width:4px;background:var(--c)}
.stp:first-child::before{top:50%}.stp:last-child::before{bottom:50%}
.dot{flex:none;width:18px;height:18px;border-radius:50%;background:var(--bg);border:4px solid var(--c);position:relative}
.stp.foc .dot{background:var(--c)}.stp.foc .nm{font-weight:700}
.nm{flex:1}.tm{font-variant-numeric:tabular-nums;color:var(--mut)}.stp.foc .tm{color:var(--ink);font-weight:700}
</style>
</head>

const lines=()=>ALL.filter(l=>l.categoriaDia===cat);
const byId=id=>ALL.find(l=>l.idRota===id);
const offs=l=>l._o||(l._o=(()=>{let t=0;const o={};for(const s of l.trajetoDetalhado||[]){t+=s.tempoDoAnteriorMinutos||0;if(!(s.idParada in o))o[s.idParada]=t}return o})());
const variant=l=>l.sublinha?.trim()||'Percurso padrão';
const title=l=>'Linha '+String(l.linha).padStart(2,'0');
const etaTxt=t=>{if(!isLive())return fm(t);const d=t-now();return d<=0?'agora':d<60?d+' min':fm(t)};

function arrivals(id){const n=now(),live=isLive(),r=[];
  for(const l of lines()){const o=offs(l)[id];if(o===undefined)continue;
    let ts=l.horarios.map(h=>hm(h)+o).sort((a,b)=>a-b);if(live)ts=ts.filter(t=>t>=n);r.push({l,ts})}
  return r.sort((a,b)=>(a.ts[0]??1e9)-(b.ts[0]??1e9))}

function arrRow(a,id,hero){const {l,ts}=a,live=isLive(),has=ts.length;
  const d=has?ts[0]-now():0,sub=has?(live&&d>0&&d<60?'às '+fm(ts[0]):(live&&d<=0?'chegando':'')):'hoje';
  const more=ts.slice(1,4).map(fm).join(' · ');
  return `<button class="${hero?'next':'row'}" style="--c:${l.corHex}" data-line="${l.idRota}" data-focus="${id}"><span class="num" style="background:${l.corHex}">${l.linha}</span><span class="info"><b>${title(l)}</b><small>${esc(variant(l))}${more?'<br>Depois: '+more:''}</small></span><span class="eta">${has?eta(ts[0]):'<b style="font-size:15px">Sem saídas</b>'}<small>${sub}</small></span></button>`}

const banner=()=>dow()===0?'<p class="note">Hoje é domingo e os dados não têm linhas internas. Escolha outro tipo de dia para ver horários.</p>':(!isLive()?`<p class="note">Mostrando horários de ${CATS.find(c=>c[0]===cat)[1].toLowerCase()}, sem previsão para agora.</p>`:'');
const catBar=()=>`<div class="chips">${CATS.map(c=>`<button data-cat="${c[0]}" class="${c[0]===cat?'on':''}">${c[1]}</button>`).join('')}</div>`;
const disclaimer='<p class="note">Previsão estimada pela grade de horários e pelo tempo entre pontos. Não usa GPS, então atrasos e trânsito não entram.</p>';
const ic=(p,f)=>`<svg class="ic" viewBox="0 0 24 24" fill="${f||'none'}" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const STAR='<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>';
const back=`<button class="back" data-back>${ic('<path d="M15 18l-6-6 6-6"/>')}Voltar</button>`;
let fav=[];try{fav=JSON.parse(localStorage.getItem('bandeco_interno_favoritos_v1')||'[]')}catch(e){}
const saveFav=()=>{try{localStorage.setItem('bandeco_interno_favoritos_v1',JSON.stringify(fav))}catch(e){}};
const eta=t=>{const x=etaTxt(t),m=x.match(/^(\d+) min$/);return m?`<b>${m[1]}<i> min</i></b>`:`<b>${x}</b>`};

function stopBody(id){const a=arrivals(id);if(!a.length)return '<p>Nenhuma linha passa aqui neste tipo de dia.</p>'+disclaimer;
  const visible=isLive()?a.filter(x=>x.ts.length):a;
  if(!visible.length)return '<p>Não há mais saídas hoje neste ponto.</p>'+disclaimer;
  const i=visible.findIndex(x=>x.ts.length);return visible.map((x,k)=>arrRow(x,id,k===i)).join('')+disclaimer}
function stopView(id){const p=S[id],on=fav.includes(id);
  return `${back}<div class="hd2"><div><h2>${esc(p.nome)}</h2><small>${esc(p.descricao||'')}</small></div><button class="star${on?' fav':''}" data-fav="${id}" aria-label="${on?'Remover dos seus pontos':'Salvar nos seus pontos'}">${ic(STAR,on?'currentColor':'none')}</button></div>${banner()}<h3>Próximos ônibus</h3>${stopBody(id)}`}

function lineView(){const l=byId(view.id),o=offs(l),n=now(),live=isLive();
  const hs=l.horarios.slice().sort((a,b)=>hm(a)-hm(b)),ni=live?hs.findIndex(h=>hm(h)>=n):-1,base=hm(hs[ni>=0?ni:0]);
  const nx=live?(ni>=0?(hm(hs[ni])-n<60?`Próxima saída em ${hm(hs[ni])-n} min (${hs[ni]})`:`Próxima saída às ${hs[ni]}`):'Sem mais saídas hoje'):'';
  const grid=hs.map((h,i)=>`<span class="t${live&&hm(h)<n?' past':''}${i===ni?' next':''}">${h}</span>`).join('');
  const cap=live&&ni>=0?'Hora estimada em cada ponto, próxima viagem':'Hora estimada em cada ponto, primeira viagem';
  const seen=new Set(),sl=(l.trajetoDetalhado||[]).filter(s=>!seen.has(s.idParada)&&seen.add(s.idParada)).map(s=>`<button class="stp${s.idParada===view.focus?' foc':''}" data-stop="${s.idParada}"><span class="dot"></span><span class="nm">${esc(S[s.idParada].nome)}</span><span class="tm">${fm(base+o[s.idParada])}</span></button>`).join('');
  return `${back}<div class="band" style="--c:${l.corHex}"><span class="num">${l.linha}</span><div><h2>${title(l)}</h2><small>${esc(variant(l))}${nx?'<br>'+nx:''}</small></div></div>${banner()}
  <h3>Saídas de ${esc(S[l.itinerarioParadasIds[0]].nome)}</h3><div class="grid" style="--c:${l.corHex}">${grid}</div>
  <h3>${cap}</h3><div class="tl" style="--c:${l.corHex}">${sl}</div>${disclaimer}`}

function nearView(){
  if(near.s==='loading')return `${back}<h2>Buscando sua localização…</h2><small>Permita o acesso quando o navegador pedir.</small>`;
  if(near.s==='err')return `${back}<h2>Não achei sua localização</h2><p>${esc(near.m)}</p><button class="btn" data-home>Buscar ponto pelo nome</button>`;
  const [t,...rest]=near.list,far=t.d>3000?'<p class="note">Você parece estar longe do campus. Mostrando o ponto mais próximo mesmo assim.</p>':'';
  return `${back}<small>Ponto mais perto de você</small><h2>${esc(t.p.nome)}</h2><small>${fmD(t.d)} de você, cerca de ${walk(t.d)} min a pé</small>${far}${banner()}<h3>Próximos ônibus aqui</h3>${stopBody(t.p.idParada)}
  <h3>Outros pontos perto</h3>${rest.map(x=>`<button class="row" data-stop="${x.p.idParada}"><span class="pin"></span><span class="info"><b>${esc(x.p.nome)}</b><small>${fmD(x.d)} · ${walk(x.d)} min a pé</small></span></button>`).join('')}`}

function stopsList(){const k=norm(q.trim());
  return D.paradas.filter(p=>norm(p.nome).includes(k)).sort((a,b)=>a.nome.localeCompare(b.nome,'pt')).map(p=>{
    const c=lines().filter(l=>offs(l)[p.idParada]!==undefined).length;
    return `<button class="row" data-stop="${p.idParada}"><span class="pin"></span><span class="info"><b>${esc(p.nome)}</b><small>${c?c+(c>1?' linhas':' linha'):'Sem linhas neste tipo de dia'}</small></span></button>`}).join('')||'<p>Nenhum ponto com esse nome.</p>'}
function linesList(){const n=now(),live=isLive();
  return lines().map(l=>{const h=l.horarios.map(hm).sort((a,b)=>a-b),nx=live?h.find(x=>x>=n):h[0];
    return `<button class="row" style="--c:${l.corHex}" data-line="${l.idRota}"><span class="num" style="background:${l.corHex}">${l.linha}</span><span class="info"><b>${title(l)}</b><small>${esc(variant(l))}</small></span><span class="eta"><b>${nx===undefined?'—':fm(nx)}</b><small>${nx===undefined?'sem saídas':'próxima saída'}</small></span></button>`}).join('')}
function favRows(){if(!fav.some(id=>S[id]))return '';return '<h3>Seus pontos</h3>'+fav.filter(id=>S[id]).map(id=>{const f=arrivals(id).find(x=>x.ts.length);
  return `<button class="row" data-stop="${id}" style="--c:${f?f.l.corHex:'var(--line)'}"><span class="info"><b>${esc(S[id].nome)}</b><small>${f?title(f.l)+' · '+esc(variant(f.l)):'Sem saídas agora'}</small></span>${f?`<span class="eta">${eta(f.ts[0])}</span>`:''}</button>`}).join('')}
function home(){return `${tab==='pontos'?`<label class="srch">${ic('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>')}<input id="q" type="search" placeholder="Buscar ponto pelo nome" value="${esc(q)}"></label>${favRows()}<div id="list">${stopsList()}</div>`:linesList()}${catBar()}${banner()}`}

function render(){
  const fallback=!window.L?'<p class="note" role="status">Mapa indisponível nesta conexão. Você ainda pode pesquisar pontos e consultar horários; para exibir o mapa, conecte-se à internet.</p>':'';
  el.innerHTML=fallback+(view.t==='home'?home():view.t==='stop'?stopView(view.id):view.t==='line'?lineView():nearView());
}

// O painel inicia recolhido no celular e usa estados intermediário/expandido sem recriar o mapa.
function syncSheet(){
  const alwaysOpen=document.body.classList.contains('no-map')||innerWidth>=760;
  const state=alwaysOpen?'full':sheetState;
  sh.classList.toggle('peek',state==='peek');
  sh.classList.toggle('full',state==='full');
  sh.classList.toggle('detail',view.t!=='home');
  const expanded=state!=='peek';
  el.setAttribute('aria-hidden',String(!expanded));
  for(const id of ['grab','sheet-toggle']){
    const b=document.getElementById(id);
    b.setAttribute('aria-expanded',String(expanded));
    b.setAttribute('aria-label',state==='peek'?'Expandir painel':state==='mid'?'Expandir detalhes':'Recolher painel');
  }
  for(const t of ['pontos','linhas']){
    const b=document.getElementById('quick-'+t),active=tab===t;
    b.classList.toggle('on',active);
    b.setAttribute('aria-pressed',String(active));
  }
}
function setSheetState(next){
  if(document.body.classList.contains('no-map')||innerWidth>=760)next='full';
  if(next==='peek' && el.contains(document.activeElement))document.getElementById('sheet-toggle').focus();
  sheetState=next;syncSheet();
}
function setExpanded(want){setSheetState(want?'mid':'peek')}
function pickQuickTab(t){
  tab=t;
  if(view.t!=='home'){hist=[];view={t:'home'};apply();}
  else render();
  setExpanded(true);
}

// O mapa é progressivo: a grade de horários funciona mesmo se o CDN do Leaflet falhar.
let map=null,route=null,sel=null,usr=null;
if(window.L){
  map=L.map('map',{zoomControl:false}).setView([-19.8695,-43.9675],15);
  L.control.zoom({position:'topright'}).addTo(map);
  const dk=matchMedia('(prefers-color-scheme:dark)').matches;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors · dados: internorotas/ufmg (MIT)'}).addTo(map);
  route=L.layerGroup().addTo(map);sel=L.layerGroup().addTo(map);usr=L.layerGroup().addTo(map);
  D.paradas.forEach(p=>{const o=p.categoria!=='Parada Regular';
    L.circleMarker(p.coordenadas,{radius:o?11:8,color:dk?'#fff':'#101828',weight:3,fillColor:o?(dk?'#fff':'#101828'):(dk?'#14181f':'#fff'),fillOpacity:1}).addTo(map).bindTooltip(p.nome).on('click',()=>go({t:'stop',id:p.idParada}))});
  // O iframe pode ficar oculto ao alternar abas; recalcular dimensões ao retornar.
  window.addEventListener('message',e=>{
    if(e.origin!==window.location.origin || !e.data || e.data.type!=='bandeco:interno:shown')return;
    requestAnimationFrame(()=>map.invalidateSize({pan:false}));
  });
  window.addEventListener('resize',()=>map.invalidateSize({pan:false}));
}else{
  document.body.classList.add('no-map');
}
function focus(pts){if(!map)return;const m=innerWidth<760;
  // Considerar a altura final do painel, inclusive durante a animacao de abertura.
  const covered=m?(sh.classList.contains('peek')?82:sh.classList.contains('full')?Math.round(innerHeight*.82):Math.round(Math.min(innerHeight*(view.t==='home'?.42:.55),view.t==='home'?360:480))):0;
  map.fitBounds(L.latLngBounds(pts),{maxZoom:17,paddingTopLeft:[m?20:375,60],paddingBottomRight:[20,covered+24]})}
function select(id){if(!sel)return;sel.clearLayers();L.circleMarker(S[id].coordenadas,{radius:14,color:'#2e90fa',weight:4,fill:false,interactive:false}).addTo(sel)}
function apply(){if(route)route.clearLayers();if(sel)sel.clearLayers();
  if(view.t!=='home')setExpanded(true);else syncSheet();
  render();
  if(view.t==='stop'){select(view.id);focus([S[view.id].coordenadas])}
  if(view.t==='line'){const l=byId(view.id);
    if(route){L.polyline(l.coordenadasTrajeto,{color:l.corHex,weight:6,opacity:.9}).addTo(route);
      l.itinerarioParadasIds.forEach(i=>L.circleMarker(S[i].coordenadas,{radius:5,color:l.corHex,weight:3,fillColor:'#fff',fillOpacity:1,interactive:false}).addTo(route));}
    if(view.focus)select(view.focus);focus(l.coordenadasTrajeto)}
  el.scrollTop=0;const f=el.querySelector('.foc');if(f)f.scrollIntoView({block:'nearest'})}
function go(v){hist.push(view);view=v;apply()}

function locate(){go({t:'near'});near={s:'loading'};render();
  if(!navigator.geolocation){near={s:'err',m:'Seu navegador não oferece localização.'};return render()}
  navigator.geolocation.getCurrentPosition(pos=>{const la=pos.coords.latitude,ln=pos.coords.longitude;
    if(usr){usr.clearLayers();L.circleMarker([la,ln],{radius:8,color:'#fff',weight:3,fillColor:'#2e90fa',fillOpacity:1,interactive:false}).addTo(usr);}
    const served=new Set(lines().flatMap(l=>Object.keys(offs(l))));
    const list=D.paradas.filter(p=>!served.size||served.has(p.idParada)).map(p=>({p,d:hav(la,ln,p.coordenadas[0],p.coordenadas[1])})).sort((a,b)=>a.d-b.d).slice(0,4);
    near={s:'ok',list};render();select(list[0].p.idParada);focus([[la,ln],list[0].p.coordenadas])},
  ()=>{near={s:'err',m:'Permita o acesso à localização no navegador ou busque o ponto pelo nome. Em arquivo aberto direto do computador, alguns navegadores bloqueiam a localização.'};render()},
  {enableHighAccuracy:true,timeout:10000,maximumAge:30000})}

el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.stop)go({t:'stop',id:d.stop});
  else if(d.line)go({t:'line',id:d.line,focus:d.focus});
  else if(d.tab){pickQuickTab(d.tab)}
  else if(d.cat){cat=d.cat;render()}
  else if(d.fav){fav=fav.includes(d.fav)?fav.filter(x=>x!==d.fav):[...fav,d.fav];saveFav();render()}
  else if(d.back!==undefined){view=hist.pop()||{t:'home'};apply()}
  else if(d.home!==undefined){hist=[];view={t:'home'};tab='pontos';apply()}});
el.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;document.getElementById('list').innerHTML=stopsList()}});
document.getElementById('loc').addEventListener('click',locate);
setInterval(()=>{if(document.activeElement&&document.activeElement.id==='q')return;const s=el.scrollTop;render();el.scrollTop=s},30000);
for(const id of ['grab','sheet-toggle'])document.getElementById(id).addEventListener('click',()=>setSheetState(sh.classList.contains('peek')?'mid':sh.classList.contains('full')?'peek':'full'));
for(const t of ['pontos','linhas'])document.getElementById('quick-'+t).addEventListener('click',()=>pickQuickTab(t));
// Deslizar sobre a cabecalho abre/fecha; rolagem da lista e gestos no mapa continuam nativos.
let gestureStart=null;
const head=document.getElementById('sheet-head');
head.addEventListener('touchstart',e=>{if(e.touches.length===1)gestureStart=e.touches[0].clientY},{passive:true});
head.addEventListener('touchend',e=>{
  if(gestureStart===null||!e.changedTouches.length)return;
  const delta=e.changedTouches[0].clientY-gestureStart;gestureStart=null;
  if(delta< -35)setExpanded(true);
  else if(delta>35)setExpanded(false);
},{passive:true});
window.addEventListener('resize',syncSheet);
apply();
})();
</script>
</body>
</html>
