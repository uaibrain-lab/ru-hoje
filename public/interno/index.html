<link rel="stylesheet" href="/assets/vendor/leaflet-1.9.4.css">
<!-- Fonte do sistema: nenhuma dependência de Google Fonts para ler horários. -->
<style>
:root{--bg:#fff;--bg2:#f2f4f7;--ink:#101828;--mut:#667085;--line:#e4e7ec;--sh:0 8px 30px rgba(16,24,40,.2)}
@media(prefers-color-scheme:dark){:root{--bg:#14181f;--bg2:#1e242d;--ink:#f5f7fa;--mut:#9aa6b6;--line:#2b333e}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #2e90fa;outline-offset:2px}
.ic{width:20px;height:20px;flex:none}
#map{position:fixed;inset:0;background:#e6ecf2}
@media(prefers-color-scheme:dark){#map{background:#28323c}}
#map-basemap-notice{position:fixed;z-index:490;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);max-width:min(380px,calc(100vw - 125px));padding:8px 10px;border-radius:10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-size:12px;text-align:center;box-shadow:var(--sh);pointer-events:none}
#map-basemap-notice[hidden]{display:none}
/* Layout P2: o mapa e o elemento principal; a barra inferior se abre sob demanda. */
#top{position:fixed;z-index:500;top:env(safe-area-inset-top,0px);left:0;padding:10px}
.fab{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;min-height:44px;padding:9px 13px;background:var(--bg);color:var(--ink);font-size:14px;font-weight:700;box-shadow:var(--sh)}
.fab .ic{width:18px;height:18px}
.btn{border:0;border-radius:999px;padding:11px 15px;background:var(--ink);color:var(--bg);font-weight:700}
#sheet{position:fixed;z-index:500;left:0;right:0;bottom:0;height:min(42dvh,360px);max-height:calc(100dvh - 75px);display:flex;flex-direction:column;overflow:hidden;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;box-shadow:0 -5px 24px rgba(16,24,40,.13);transition:height .23s ease}
#sheet.peek{height:calc(108px + env(safe-area-inset-bottom,0px))}
#sheet.detail:not(.peek){height:min(55dvh,480px)}
#sheet.full,#sheet.detail.full{height:min(82dvh,calc(100dvh - 75px))}
#grab{display:block;flex:none;z-index:2;width:100%;height:44px;border:0;background:var(--bg);padding:0;touch-action:pan-y}
#grab::after{content:"";display:block;width:38px;height:4px;border-radius:3px;background:var(--mut);opacity:.5;margin:18px auto 0}
.sheet-head{display:flex;align-items:center;gap:8px;flex:none;padding:3px 10px 9px 14px;min-height:54px}
.sheet-identity{min-width:0;flex:0 0 auto;display:flex;flex-direction:column;gap:0;line-height:1.15}
.sheet-identity strong{font-size:16px;letter-spacing:-.35px}
.sheet-identity span{color:var(--mut);font-size:10px;font-weight:700;letter-spacing:.65px}
.quick-tabs{display:flex;flex:1;min-width:0;justify-content:flex-end;gap:4px}
.quick-tabs button{border:1px solid var(--line);border-radius:999px;padding:8px 11px;min-height:44px;background:var(--bg2);font-weight:700;font-size:13px;white-space:nowrap}
.quick-tabs button.on{background:var(--ink)!important;color:var(--bg)!important}
.sheet-toggle{flex:none;display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:var(--bg2)}
.sheet-toggle svg{width:18px;height:18px;transition:transform .23s}
#sheet:not(.peek) .sheet-toggle svg{transform:rotate(180deg)}
#body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:7px 13px calc(16px + env(safe-area-inset-bottom,0px));scrollbar-width:thin}
#sheet.peek #body{visibility:hidden;pointer-events:none;overflow:hidden}
@media(max-width:360px){.sheet-head{gap:5px;padding-left:10px;padding-right:7px}.sheet-identity strong{font-size:14px}.quick-tabs button{padding:7px 8px;font-size:12px}.sheet-toggle{width:44px;height:44px}}
@media(min-width:760px){#sheet,#sheet.peek,#sheet.detail:not(.peek){left:14px;top:76px;bottom:14px;right:auto;width:min(346px,calc(100vw - 80px));height:auto;max-height:none;border:1px solid var(--line);border-radius:19px}#grab{display:none}#body,#sheet.peek #body{visibility:visible;pointer-events:auto;overflow-y:auto;padding-top:9px}.sheet-head .sheet-toggle{display:none}.sheet-head{padding-top:12px}}
@media(prefers-reduced-motion:reduce){#sheet,.sheet-toggle svg{transition:none}}
/* Fallback quando o Leaflet externo estiver indisponível: horários permanecem navegáveis. */
body.no-map #map{display:none}
body.no-map #sheet,body.no-map #sheet.peek,body.no-map #sheet.detail:not(.peek){position:fixed;top:65px;bottom:0;left:0;right:0;width:100%;height:calc(100dvh - 65px);max-height:none;transition:none;box-shadow:none;border-radius:18px 18px 0 0}
body.no-map #grab,body.no-map .sheet-toggle{display:none}
body.no-map #body,body.no-map #sheet.peek #body{visibility:visible;pointer-events:auto;overflow-y:auto}
@media(min-width:760px){body.no-map #sheet,body.no-map #sheet.peek,body.no-map #sheet.detail:not(.peek){left:0;right:0;top:65px;bottom:0;width:min(720px,100%);height:calc(100dvh - 65px);margin:auto;border-radius:18px 18px 0 0}}

h1{font-size:24px;margin:0}h2{font-size:21px;margin:0;line-height:1.2}h3{font-size:16px;margin:18px 0 8px}
small{color:var(--mut);font-size:13px;line-height:1.3}
.note{color:var(--mut);font-size:13px;margin:12px 0 0}
i{font-style:normal;font-size:14px;font-weight:400}
.back{display:flex;align-items:center;justify-content:center;gap:4px;border:0;background:none;padding:0;width:36px;height:36px;border-radius:10px;font-weight:700;color:var(--mut)}
.back:hover,.back:focus-visible{background:var(--bg2);color:var(--ink)}
.back--icon .ic{width:20px;height:20px}
.point-detail-head{display:grid;grid-template-columns:44px minmax(0,1fr) 44px 44px;align-items:center;gap:4px;min-height:44px;margin:0 0 6px}
.point-detail-head h2{min-width:0;margin:0;font-size:clamp(16px,4.8vw,19px);line-height:1.25;display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.point-detail-head .back,.point-detail-head .star,.point-detail-toggle{width:44px;height:44px}
.point-detail-toggle{display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:var(--bg2)}
.point-name{position:relative;min-width:0;display:flex;align-items:center;gap:6px}
.point-name h2{flex:1}
.point-info{flex:none;width:44px;height:44px;padding:0;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:var(--bg2);color:var(--mut)}
.point-info:hover,.point-info:focus-visible,.point-info[aria-expanded="true"]{color:var(--ink);border-color:var(--ink)}
.point-info .ic{width:15px;height:15px}
.point-info-popover{position:absolute;z-index:2;top:calc(100% + 7px);left:0;right:0;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);color:var(--mut);font-size:12px;line-height:1.4;box-shadow:0 6px 18px rgba(16,24,40,.16)}
.point-info-popover p{margin:0}
#sheet.detail .sheet-identity,#sheet.detail .quick-tabs{display:none}
#sheet.detail .sheet-head{display:none}
.point-detail-head+h3{margin-top:0}
.row,.next{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;margin:0 0 8px}
.row{background:var(--bg2);border-radius:12px;padding:8px 10px;border-left:4px solid var(--c,transparent);min-height:48px}
.next{background:var(--c);color:#fff;border-radius:16px;padding:10px 12px;margin-bottom:8px}
.next small{color:#ffffffe0}.next .num{background:#ffffff38!important;width:44px;height:44px;font-size:24px}.next .eta b{font-size:26px;line-height:1}.next .eta i{color:#fff}
.num{flex:none;width:44px;height:44px;border-radius:12px;color:#fff;display:grid;place-items:center;font-weight:700;font-size:22px}
.pin{flex:none;width:14px;height:14px;border-radius:50%;border:3px solid var(--ink);margin:0 15px}
.info{flex:1;min-width:0}.info b{display:block}
.eta{flex:none;text-align:right}.eta b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}.eta small{display:block}
.on{background:var(--ink)!important;color:var(--bg)!important;border-color:var(--ink)!important}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chips button{border:1px solid var(--line);background:none;border-radius:999px;padding:9px 12px;min-height:44px;font-size:14px}
.srch{display:flex;align-items:center;gap:8px;background:var(--bg2);border-radius:12px;padding:0 12px;margin:0 0 10px}
.srch input{flex:1;min-width:0;font:inherit;font-size:16px;min-height:48px;border:0;background:none;color:var(--ink);padding:10px 0;outline:none}
.srch:focus-within{outline:2px solid var(--ink)}
.hd2{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.star{flex:none;border:0;background:var(--bg2);border-radius:50%;width:44px;height:44px;display:grid;place-items:center;color:var(--mut)}.star.fav{color:#f79009}
.band{display:flex;gap:12px;align-items:center;background:var(--c);color:#fff;border-radius:20px;padding:14px;margin:0 0 4px}
.band small{color:#ffffffe0}.band .num{background:#ffffff38;width:56px;height:56px;font-size:30px}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.t{padding:7px 10px;border-radius:9px;background:var(--bg2);font-variant-numeric:tabular-nums}
.t.past{opacity:.4;text-decoration:line-through}.t.next{background:var(--c);color:#fff;font-weight:700}
.tl{margin:0}
.stp{display:flex;align-items:center;gap:12px;position:relative;width:100%;border:0;background:none;text-align:left;padding:10px 0}
.stp::before{content:"";position:absolute;left:7px;top:0;bottom:0;width:4px;background:var(--c)}
.stp:first-child::before{top:50%}.stp:last-child::before{bottom:50%}
.dot{flex:none;width:18px;height:18px;border-radius:50%;background:var(--bg);border:4px solid var(--c);position:relative}
.stp.foc .dot{background:var(--c)}.stp.foc .nm{font-weight:700}
.nm{flex:1}.tm{font-variant-numeric:tabular-nums;color:var(--mut)}.stp.foc .tm{color:var(--ink);font-weight:700}

/* Filtro de procedência na subaba Linhas; linha interna é a primeira opção. */
.bus-line-filters{display:flex;align-items:center;justify-content:flex-end;min-height:44px;margin:0 0 8px}
.bus-line-filters .filter-cycle{background:var(--bg2);box-shadow:none;padding:8px 12px}

.bus-line-group{display:flex;align-items:center;justify-content:space-between;gap:6px;
  font-size:13px;font-weight:850;margin:13px 0 9px}
.bus-line-group small{font-size:11px;font-weight:550;color:var(--mut)}
.bus-line-external{--c:#695ac7;min-height:53px}
.bus-line-external .bus-code{flex:none;min-width:52px;text-align:center;background:#695ac7;
  color:#fff;padding:8px 6px;border-radius:11px;font-size:13px;font-weight:800}
.bus-line-external .info small{font-size:11px;line-height:1.4}
.bus-line-hint{font-size:12px;line-height:1.55;color:var(--mut)}
.bus-line-more{display:block;width:100%;min-height:44px;border:1px solid var(--line);
  border-radius:12px;background:var(--bg2);font-size:12px;font-weight:750;padding:9px 12px}
.bus-line-search{margin:8px 0}
.bus-line-note{font-size:11px;line-height:1.5;color:var(--mut);margin:8px 0}
.bus-fav-row{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.bus-fav-row>.row{flex:1;min-width:0;margin:0}
.bus-fav-row>.star{flex:none;width:44px;height:44px;border:1px solid var(--line)}
.bus-fav-row>.star.fav{color:#d88a00}
/* Ao entrar em Linhas, exibir os primeiros ônibus sem obrigar a expandir. */
@media(max-width:759px){
  #sheet.lines-mode:not(.peek):not(.full):not(.detail){height:min(68dvh,560px)}
  /* Calendários em uma só faixa; mais espaço para os primeiros ônibus. */
  #sheet.lines-mode .chips{display:flex;flex-wrap:nowrap;gap:5px;overflow-x:auto;
    overscroll-behavior-x:contain;scrollbar-width:none;margin:7px 0 4px;padding-bottom:2px}
  #sheet.lines-mode .chips::-webkit-scrollbar{display:none}
  #sheet.lines-mode .chips button{flex:none;white-space:nowrap;
    padding:8px 10px;min-height:42px;font-size:12px}
}
/* Quando o mapa-base falhar no celular, o aviso não cobre a geolocalização. */
@media(max-width:759px){
  #map-basemap-notice{
    top:calc(65px + env(safe-area-inset-top,0px));
    left:12px;transform:none;max-width:min(280px,calc(100vw - 100px));
  }
}
/* Controle visível sobre o mapa: sem obrigar a abrir a lista de linhas. */
#map-source-switch{position:fixed;z-index:485;top:calc(60px + env(safe-area-inset-top,0px));
  left:50%;transform:translateX(-50%);max-width:calc(100vw - 110px)}
.filter-cycle{display:inline-flex;justify-content:center;align-items:center;gap:7px;
  border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);
  min-height:44px;padding:9px 12px;box-shadow:0 3px 13px #0002;font-size:12px;
  font-weight:750;white-space:nowrap;cursor:pointer;touch-action:manipulation}
.filter-cycle svg{width:16px;height:16px;flex:none}
.filter-cycle .filter-next{font-size:13px;color:var(--mut);line-height:1;margin-left:2px}
.filter-cycle:focus-visible{outline:3px solid #2e90fa;outline-offset:2px}
#map-filter-toggle{min-width:104px}

#map-data-status{position:fixed;z-index:480;top:calc(108px + env(safe-area-inset-top,0px));
 left:50%;transform:translateX(-50%);pointer-events:none;text-align:center;
 width:max-content;max-width:min(350px,calc(100vw - 20px));margin:0;
 padding:5px 10px;border:1px solid var(--line);border-radius:999px;
 background:var(--bg);color:var(--mut);font-size:10.5px;line-height:1.4;box-shadow:var(--sh)}
@media(min-width:760px){#map-source-switch{top:12px}#map-data-status{top:61px}}
@media(max-width:759px){#map-basemap-notice{top:calc(148px + env(safe-area-inset-top,0px))}}
.interno-stop{transition:opacity .1s}
.gps-bus-pin{width:46px;height:43px;display:flex;flex-direction:column;align-items:center;
  gap:1px;filter:drop-shadow(0 3px 4px #0005);pointer-events:auto}
.gps-bus-shape{width:28px;height:29px;display:grid;place-items:center;
  border:2px solid #fff;border-radius:8px;background:#087d69;color:#fff;
  transform-origin:center;box-shadow:0 1px 5px #0003}
.gps-bus-shape svg{width:21px;height:24px;display:block}
.gps-bus-code{max-width:45px;display:block;padding:0 4px;border:1px solid #087d69;
  border-radius:5px;background:#fff;color:#075649;font-size:9px;
  font-weight:850;line-height:11px;overflow:hidden;text-overflow:ellipsis}


/* UX: mapa desobstruído e ferramentas de Linhas em uma faixa única.
 * Os alvos continuam com pelo menos 44px; conteúdo, horários e GPS inalterados. */
#top{top:env(safe-area-inset-top,0px);padding:10px}
#loc{min-height:44px;gap:6px;padding:8px 11px;font-size:12.5px;box-shadow:0 3px 12px #0002}
#map-source-switch{top:calc(10px + env(safe-area-inset-top,0px));
  left:auto;right:68px;transform:none;max-width:calc(100vw - 235px)}
#map-filter-toggle{min-height:44px;min-width:106px;padding:8px 10px;box-shadow:0 3px 12px #0002}
#map-data-status{top:calc(68px + env(safe-area-inset-top,0px));
  left:12px;right:auto;transform:none;max-width:min(270px,calc(100vw - 102px));
  font-size:10px;line-height:1.35;padding:5px 9px;
  text-align:left;border-color:var(--line);box-shadow:0 2px 9px #0001}
#map-basemap-notice{top:calc(109px + env(safe-area-inset-top,0px));
  left:12px;right:auto;bottom:auto;transform:none;
  max-width:min(238px,calc(100vw - 102px));
  text-align:left;font-size:10px;line-height:1.35;
  padding:5px 9px;box-shadow:0 2px 9px #0001}
#sheet:not(.detail) .sheet-identity{display:none}
#sheet:not(.detail) .quick-tabs{justify-content:flex-start;gap:8px}
#sheet:not(.detail) .sheet-head{padding:4px 14px 10px;gap:10px}
#sheet:not(.detail) .quick-tabs button{min-width:78px}
#sheet.lines-mode #body{padding-left:15px;padding-right:15px}
.bus-line-tools{display:flex;align-items:center;gap:10px;margin:5px 0 13px}
.bus-line-tools .bus-line-search{display:flex;flex:1;min-width:0;
  margin:0;height:46px;border-radius:13px;background:var(--bg2)}
.bus-line-tools .bus-line-search input{min-width:0;font-size:15px;
  min-height:44px;padding:9px 0}
.bus-line-tools .bus-line-search .ic{width:18px;height:18px;flex:none}
.bus-line-tools .bus-line-filters{flex:none;min-height:44px;margin:0}
.bus-line-tools .bus-line-filters .filter-cycle{box-shadow:none;
  min-height:44px;border-color:var(--line);background:var(--bg)}
#sheet.lines-mode .bus-line-group{margin-top:17px;margin-bottom:10px}
#sheet.lines-mode .bus-fav-row{margin-bottom:10px}
@media(max-width:759px){
  #sheet.lines-mode:not(.peek):not(.full):not(.detail){height:min(62dvh,520px)}
  #map-basemap-notice{top:calc(109px + env(safe-area-inset-top,0px));
    left:12px;transform:none;max-width:min(238px,calc(100vw - 102px))}
}
@media(min-width:760px){
  #map-source-switch{right:68px}
  #map-data-status{left:auto;right:68px;top:calc(69px + env(safe-area-inset-top,0px));
    max-width:230px;text-align:right}
  #map-basemap-notice{left:auto;right:68px;top:calc(109px + env(safe-area-inset-top,0px))}
}
@media(max-width:360px){
  #top{padding:10px 8px}
  #loc{padding:7px 9px;font-size:12px}
  #map-source-switch{right:64px;max-width:calc(100vw - 205px)}
  #map-filter-toggle{min-width:99px;padding:8px 8px;gap:5px}
  .bus-line-tools{gap:7px}
  .bus-line-tools .bus-line-filters .filter-cycle{padding:8px 9px;gap:4px}
}

/* Acabamento do design system Ônibus — ritmo 8/12/16px, superfícies discretas,
   contraste de texto e prioridade para as informações de linha/horário. */
#sheet.lines-mode .bus-line-group{
  margin:18px 0 11px;gap:12px;font-size:14px;font-weight:780;
  letter-spacing:-.2px;line-height:1.35
}
#sheet.lines-mode .bus-line-group small{
  color:var(--mut);font-size:12px;font-weight:550;letter-spacing:0;
  text-align:right;line-height:1.35
}
#sheet.lines-mode .chips{gap:8px}
#sheet.lines-mode .chips button{min-height:44px}
#sheet.lines-mode #bus-lines-list .row{
  min-height:72px;gap:12px;margin:0;
  border:1px solid var(--line);border-left:3px solid var(--c,transparent);
  border-radius:14px;background:var(--bg);padding:11px 12px;
  transition:background-color .14s ease,border-color .14s ease,transform .14s ease;
}
#sheet.lines-mode #bus-lines-list .row .num{
  width:42px;height:42px;border-radius:11px;font-size:19px;font-weight:780;
}
#sheet.lines-mode #bus-lines-list .row .info b{
  font-size:15px;line-height:1.25;font-weight:750;letter-spacing:-.2px;
}
#sheet.lines-mode #bus-lines-list .row .info small{
  display:block;font-size:12px;line-height:1.5;
  color:var(--mut);margin-top:4px;
}
#sheet.lines-mode #bus-lines-list .row .eta b{
  font-size:21px;line-height:1.15;letter-spacing:-.45px;font-weight:780;
}
#sheet.lines-mode #bus-lines-list .row .eta small{
  margin-top:3px;font-size:11.5px;line-height:1.25;
}
#sheet.lines-mode #bus-lines-list .bus-code{
  min-width:48px;padding:9px 7px;border-radius:11px;font-size:13px;
}
#sheet.lines-mode #bus-lines-list .bus-fav-row{gap:10px;margin:0 0 10px}
#sheet.lines-mode #bus-lines-list .bus-fav-row>.star{
  background:var(--bg);border-color:var(--line);color:var(--mut);
}
#sheet.lines-mode #bus-lines-list .bus-fav-row>.star.fav{color:#c68112}
#sheet.lines-mode #bus-lines-list .row:focus-visible,
#sheet.lines-mode #bus-lines-list .star:focus-visible{
  outline:3px solid #2e90fa;outline-offset:2px;
}
#sheet.lines-mode .bus-line-note{font-size:12px;line-height:1.55;margin:14px 2px}
#sheet.lines-mode .bus-line-hint{font-size:13px;line-height:1.55;margin:12px 2px}
#sheet.lines-mode .bus-line-more{margin:12px 0;border-radius:12px;font-size:13px}
@media(hover:hover){
  #sheet.lines-mode #bus-lines-list .row:hover{
    border-color:var(--mut);background:var(--bg2);
  }
}
@media(prefers-reduced-motion:reduce){
  #sheet.lines-mode #bus-lines-list .row{transition:none}
}

/* Status reais do mapa em pilha fluida: nunca duas pílulas soltas/sobrepostas. */
#map-feedback{
  position:fixed;z-index:480;top:calc(68px + env(safe-area-inset-top,0px));
  left:12px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;
  max-width:min(270px,calc(100vw - 102px));pointer-events:none;
}
#map-feedback #map-data-status,
#map-feedback #map-basemap-notice{
  position:static;inset:auto;top:auto;left:auto;right:auto;bottom:auto;
  transform:none;width:auto;max-width:100%;margin:0;
  border:1px solid var(--line);border-radius:12px;
  background:var(--bg);color:var(--mut);padding:7px 10px;
  font-size:11.5px;line-height:1.45;text-align:left;
  box-shadow:0 2px 9px #0001;
}
#map-feedback #map-basemap-notice[hidden]{display:none}
@media(min-width:760px){
  #map-feedback{left:auto;right:68px;align-items:flex-end}
}

@media(max-width:350px){
  /* Uma mão, telas compactas: localização mantém ação acessível sem competir
     com o filtro Todos/Internos/Municipais. Nome acessível no botão. */
  #loc{width:44px;min-width:44px;justify-content:center;padding:0;font-size:0}
  #loc .ic{width:20px;height:20px}
  #map-source-switch{max-width:calc(100vw - 140px)}
  #sheet.lines-mode .bus-line-tools{gap:6px}
  #sheet.lines-mode .bus-line-tools .filter-cycle{padding:8px;gap:5px}
}

/* O status do mapa é uma superfície única, não duas notificações concorrentes. */
#map-feedback{
  gap:5px;padding:9px 11px;border:1px solid var(--line);
  border-radius:14px;background:var(--bg);
  box-shadow:0 3px 12px #0002;
}
#map-feedback #map-data-status,
#map-feedback #map-basemap-notice{
  border:0;border-radius:0;box-shadow:none;background:transparent;
  padding:0;width:auto;max-width:100%;margin:0;line-height:1.5;
  font-size:11.5px;color:var(--mut);
}
#map-feedback #map-basemap-notice:not([hidden]){
  border-top:1px solid var(--line);padding-top:6px;
}

/* Pontos: cartões tão leves quanto Linhas, com títulos longos controlados
   sem remover a informação completa do DOM ou do leitor de tela. */
#sheet:not(.detail) #list .bus-fav-row{gap:9px;margin:0 0 10px}
#sheet:not(.detail) #list .row{
  min-height:67px;padding:10px 12px;margin:0;gap:9px;
  background:var(--bg);border:1px solid var(--line);
  border-radius:14px;transition:background-color .14s ease,border-color .14s ease;
}
#sheet:not(.detail) #list .row .pin{
  margin:0 7px;flex:none;width:13px;height:13px;border-width:3px;
}
#sheet:not(.detail) #list .row .info b{
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
  overflow:hidden;font-size:14px;font-weight:720;line-height:1.35;letter-spacing:-.1px;
}
#sheet:not(.detail) #list .row .info small{
  display:block;margin-top:4px;font-size:12px;line-height:1.3;
}
#sheet:not(.detail) #list .bus-fav-row>.star{
  background:var(--bg);border-color:var(--line);
}
#sheet:not(.detail) #list .row:focus-visible,
#sheet:not(.detail) #list .star:focus-visible{outline:3px solid #2e90fa;outline-offset:2px}
@media(hover:hover){
  #sheet:not(.detail) #list .row:hover{background:var(--bg2);border-color:var(--mut)}
}
@media(prefers-reduced-motion:reduce){
  #sheet:not(.detail) #list .row{transition:none}
}

/* Evitar controles duplicados: em Linhas aberto o filtro da lista já controla
   o mapa; em Pontos ou com o painel recolhido o botão flutuante reaparece. */
#map-source-switch{transition:opacity .16s ease}
@media(max-width:759px){
  body.lines-filter-in-sheet #map-source-switch{
    visibility:hidden;opacity:0;pointer-events:none
  }
  #sheet.lines-mode .bus-line-tools{
    position:sticky;top:-7px;z-index:4;
    background:var(--bg);padding:10px 0 9px;margin:0 0 5px;
  }
}
.filter-cycle:active{transform:scale(.98)}
@media(prefers-reduced-motion:reduce){
  #map-source-switch{transition:none}
  .filter-cycle:active{transform:none}
}

async function loadExternalLines(force=false){
  if(externalInflight)return externalInflight;
  if(!force&&externalState==='ready'&&Date.now()-externalLastCheck<300000)return;
  externalState='loading';repaintLineList();
  externalInflight=(async()=>{
    try{
      const r=await fetch('/externo/catalog/manifest.json',{cache:'no-store',headers:{Accept:'application/json'}});
      if(!r.ok)throw Error('MISSING_CATALOG');
      const m=await r.json(),day=municipalDay();
      if(!m||typeof m.gtfsVersion!=='string'||!m.gtfsVersion.trim()||
        !Number.isInteger(m.routes)||m.routes<1||!Number.isInteger(m.stops)||m.stops<1||
        !/^[0-9]{8}$/.test(m.feedStartDate)||!/^[0-9]{8}$/.test(m.feedEndDate)||
        day<m.feedStartDate||day>m.feedEndDate)throw Error('EXPIRED_GTFS');
      const l=await fetch('/externo/catalog/routes.json',{cache:'no-store'});
      if(!l.ok)throw Error('MISSING_ROUTES');
      const data=await l.json();
      if(!Array.isArray(data)||data.length!==m.routes||data.some(a=>!a||
        typeof a.code!=='string'||!a.code.trim()||typeof a.name!=='string'))
        throw Error('INVALID_ROUTES');
      externalRoutes=data.slice().sort((a,b)=>a.code.localeCompare(b.code,'pt-BR',{numeric:true}));
      externalState='ready';externalLastCheck=Date.now();
    }catch(e){externalState=e.message==='EXPIRED_GTFS'?'expired':'unavailable';externalRoutes=[]}
    finally{externalInflight=null;repaintLineList()}
  })();
  return externalInflight;
}

const etaTxt=t=>{if(!isLive())return fm(t);const d=t-now();return d<=0?'agora':d<60?d+' min':fm(t)};

function arrivals(id){const n=now(),live=isLive(),r=[];
  for(const l of lines()){const o=offs(l)[id];if(o===undefined)continue;
    let ts=l.horarios.map(h=>hm(h)+o).sort((a,b)=>a-b);if(live)ts=ts.filter(t=>t>=n);r.push({l,ts})}
  return r.sort((a,b)=>(a.ts[0]??1e9)-(b.ts[0]??1e9))}

function arrRow(a,id,hero){const {l,ts}=a,live=isLive(),has=ts.length;
  const d=has?ts[0]-now():0,sub=has?(live&&d>0&&d<60?'às '+fm(ts[0]):(live&&d<=0?'chegando':'')):'hoje';
  const more=ts.slice(1,4).map(fm).join(' · ');
  return `<button class="${hero?'next':'row'}" style="--c:${l.corHex}" data-line="${l.idRota}" data-focus="${id}"><span class="num" style="background:${l.corHex}">${l.linha}</span><span class="info"><b>${title(l)}</b><small>${esc(variant(l))}${more?'<br>Depois: '+more:''}</small></span><span class="eta">${has?eta(ts[0]):'<b style="font-size:15px">Sem saídas</b>'}<small>${sub}</small></span></button>`}

const banner=()=>dow()===0?'<p class="note">Hoje é domingo e os dados não têm linhas internas. Escolha outro tipo de dia para ver horários.</p>':(!isLive()?`<p class="note">Mostrando horários de ${CATS.find(c=>c[0]===cat)[1].toLowerCase()}, sem previsão para agora.</p>`:'');
const catBar=()=>`<div class="chips">${CATS.map(c=>`<button data-cat="${c[0]}" class="${c[0]===cat?'on':''}">${c[1]}</button>`).join('')}</div>`;
const disclaimer='<p class="note">Previsão estimada pela grade de horários e pelo tempo entre pontos. Não usa GPS, então atrasos e trânsito não entram.</p>';
const ic=(p,f)=>`<svg class="ic" viewBox="0 0 24 24" fill="${f||'none'}" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const STAR='<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>';

const saveFav=()=>{try{localStorage.setItem('bandeco_interno_favoritos_v1',JSON.stringify(fav))}catch(e){}};
let externalFav=[];try{externalFav=JSON.parse(localStorage.getItem('hub_onibus_pontos_bh_favoritos_v1')||'[]')}catch{}
let lineFav=[];try{lineFav=JSON.parse(localStorage.getItem('hub_onibus_linhas_favoritas_v1')||'[]')}catch{}
const SHARED_EXTERNAL_KEY='hubufmg-externo-favorites-v1';
function sharedExternal(){
  try{const data=JSON.parse(localStorage.getItem(SHARED_EXTERNAL_KEY)||'{}');
    return data&&typeof data==='object'&&!Array.isArray(data)?data:{};}
  catch{return {}}
}
function storeSharedExternal(field,values){
  try{const data=sharedExternal();data[field]=values;
    localStorage.setItem(SHARED_EXTERNAL_KEY,JSON.stringify(data));}
  catch{/* Favoritos continuam no dispositivo atual quando armazenamento estiver bloqueado. */}
}
function syncSharedExternal(){
  const data=sharedExternal();
  if(Array.isArray(data.stops))externalFav=data.stops.map(String);
  if(Array.isArray(data.routes))
    lineFav=[...lineFav.filter(code=>code.startsWith('int:')),
             ...data.routes.map(code=>'ext:'+String(code))];
}
syncSharedExternal();
const saveExtFav=()=>{try{localStorage.setItem('hub_onibus_pontos_bh_favoritos_v1',JSON.stringify(externalFav))}catch{};
  storeSharedExternal('stops',externalFav)};
const saveLineFav=()=>{try{localStorage.setItem('hub_onibus_linhas_favoritas_v1',JSON.stringify(lineFav))}catch{};
  storeSharedExternal('routes',lineFav.filter(code=>code.startsWith('ext:')).map(code=>code.slice(4)))};
window.addEventListener('storage',event=>{
  if(event.key!==SHARED_EXTERNAL_KEY)return;
  syncSharedExternal();

});
function starRow(html,id,on,name,key){
  return '<div class="bus-fav-row">'+html+'<button type="button" class="star'+(on?' fav':'')+
    '" data-'+key+'="'+esc(id)+'" aria-pressed="'+on+'" aria-label="'+
    esc((on?'Remover favorito: ':'Favoritar: ')+name)+'">'+ic(STAR,on?'currentColor':'none')+'</button></div>';
}
function repaintFavorites(){const scroll=el.scrollTop;render();el.scrollTop=scroll}

const eta=t=>{const x=etaTxt(t),m=x.match(/^(\d+) min$/);return m?`<b>${m[1]}<i> min</i></b>`:`<b>${x}</b>`};

function stopBody(id){const a=arrivals(id);if(!a.length)return '<p>Nenhuma linha passa aqui neste tipo de dia.</p>'+disclaimer;
  const visible=isLive()?a.filter(x=>x.ts.length):a;
  if(!visible.length)return '<p>Não há mais saídas hoje neste ponto.</p>'+disclaimer;
  const i=visible.findIndex(x=>x.ts.length);return visible.map((x,k)=>arrRow(x,id,k===i)).join('')+disclaimer}
function stopView(id){const p=S[id],on=fav.includes(id),desc=String(p.descricao||'').trim();
  const info=desc?`<span class="point-name"><h2>${esc(stopName(p))}</h2><button type="button" class="point-info" data-info aria-expanded="false" aria-label="Informações sobre este ponto" title="Informações sobre este ponto">${ic('<circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/>')}</button><span class="point-info-popover" data-info-content role="tooltip" hidden><p>${esc(desc)}</p></span></span>`:`<h2>${esc(stopName(p))}</h2>`;
  return `<div class="point-detail-head">${back}${info}<button class="star${on?' fav':''}" data-fav="${id}" aria-label="${on?'Remover dos seus pontos':'Salvar nos seus pontos'}">${ic(STAR,on?'currentColor':'none')}</button><button type="button" class="point-detail-toggle" data-sheet-toggle aria-label="Recolher painel" aria-expanded="true" aria-controls="body"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div><h3>Próximos ônibus</h3>${stopBody(id)}${banner()}`}

function lineView(){const l=byId(view.id),o=offs(l),n=now(),live=isLive();
  const hs=l.horarios.slice().sort((a,b)=>hm(a)-hm(b)),ni=live?hs.findIndex(h=>hm(h)>=n):-1,base=hm(hs[ni>=0?ni:0]);
  const nx=live?(ni>=0?(hm(hs[ni])-n<60?`Próxima saída em ${hm(hs[ni])-n} min (${hs[ni]})`:`Próxima saída às ${hs[ni]}`):'Sem mais saídas hoje'):'';
  const grid=hs.map((h,i)=>`<span class="t${live&&hm(h)<n?' past':''}${i===ni?' next':''}">${h}</span>`).join('');
  const cap=live&&ni>=0?'Hora estimada em cada ponto, próxima viagem':'Hora estimada em cada ponto, primeira viagem';
  const seen=new Set(),sl=(l.trajetoDetalhado||[]).filter(s=>!seen.has(s.idParada)&&seen.add(s.idParada)).map(s=>`<button class="stp${s.idParada===view.focus?' foc':''}" data-stop="${s.idParada}"><span class="dot"></span><span class="nm">${esc(stopName(S[s.idParada]))}</span><span class="tm">${fm(base+o[s.idParada])}</span></button>`).join('');
  return `${back}<div class="band" style="--c:${l.corHex}"><span class="num">${l.linha}</span><div><h2>${title(l)}</h2><small>${esc(variant(l))}${nx?'<br>'+nx:''}</small></div></div>${banner()}
  <h3>Saídas de ${esc(stopName(S[l.itinerarioParadasIds[0]]))}</h3><div class="grid" style="--c:${l.corHex}">${grid}</div>
  <h3>${cap}</h3><div class="tl" style="--c:${l.corHex}">${sl}</div>${disclaimer}`}

function nearView(){
  if(near.s==='loading')return `${back}<h2>Buscando sua localização…</h2><small>Permita o acesso quando o navegador pedir.</small>`;
  if(near.s==='err')return `${back}<h2>Não achei sua localização</h2><p>${esc(near.m)}</p><button class="btn" data-home>Buscar ponto pelo nome</button>`;
  const [t,...rest]=near.list,far=t.d>3000?'<p class="note">Você parece estar longe do campus. Mostrando o ponto mais próximo mesmo assim.</p>':'';
  return `${back}<small>Ponto mais perto de você</small><h2>${esc(stopName(t.p))}</h2><small>${fmD(t.d)} de você, cerca de ${walk(t.d)} min a pé</small>${far}${banner()}<h3>Próximos ônibus aqui</h3>${stopBody(t.p.idParada)}
  <h3>Outros pontos perto</h3>${rest.map(x=>`<button class="row" data-stop="${x.p.idParada}"><span class="pin"></span><span class="info"><b>${esc(stopName(x.p))}</b><small>${fmD(x.d)} · ${walk(x.d)} min a pé</small></span></button>`).join('')}`}

function stopsList(){
  const term=norm(q.trim());let out='';
  if(mapMode!=='external'){
    const internal=D.paradas.filter(p=>norm(stopName(p)).includes(term)||norm(p.nome).includes(term))
      .sort((a,b)=>Number(fav.includes(b.idParada))-Number(fav.includes(a.idParada))||
        a.nome.localeCompare(b.nome,'pt'));
    if(mapMode==='all')out+='<h3 class="bus-line-group">Internos <small>UFMG</small></h3>';
    out+=internal.map(p=>{
      const count=lines().filter(l=>offs(l)[p.idParada]!==undefined).length;
      const row='<button class="row" data-stop="'+esc(p.idParada)+'"><span class="pin"></span>'+
        '<span class="info"><b>'+esc(stopName(p))+'</b><small>'+
        (count?count+(count>1?' linhas':' linha'):'Sem saídas neste dia')+'</small></span></button>';
      return starRow(row,p.idParada,fav.includes(p.idParada),stopName(p),'fav-stop-list');
    }).join('')||'<p>Nenhum ponto interno corresponde à busca.</p>';
  }
  if(mapMode!=='internal'){
    out+='<h3 class="bus-line-group">Municipais <small>Belo Horizonte</small></h3>';
    if(externalStops){
      const center=map?.getCenter()||{lat:-19.8695,lng:-43.9675};
      const items=Object.entries(externalStops).filter(([id,p])=>Array.isArray(p)&&
        (!term||norm(p[0]+' '+id).includes(term)))
        .sort((a,b)=>Number(externalFav.includes(b[0]))-Number(externalFav.includes(a[0]))||
          ((+a[1][1]-center.lat)**2+(+a[1][2]-center.lng)**2)-
          ((+b[1][1]-center.lat)**2+(+b[1][2]-center.lng)**2));
      const shown=items.slice(0,term?70:28);
      out+=shown.map(([id,p])=>starRow('<button class="row" data-ext-stop="'+esc(id)+'">'+
        '<span class="pin" style="border-color:#7556c9"></span><span class="info"><b>'+
        esc(p[0])+'</b><small>Municipal BH · horários e GPS</small></span></button>',
        id,externalFav.includes(id),p[0],'fav-ext-stop')).join('')||
        '<p>Nenhum ponto municipal corresponde à busca.</p>';
      if(items.length>shown.length)out+='<p class="bus-line-note">Busque pelo nome para encontrar outro ponto.</p>';
    }else out+='<p role="status" class="bus-line-hint">Pontos municipais temporariamente indisponíveis ou carregando.</p>';
  }
  return out;
}
function combinedLineRows(){
  const search=norm(lineQuery.trim()),n=now(),live=isLive();let output='';
  if(lineFilter!=='external'){
    const internal=lines().filter(l=>norm(title(l)+' '+variant(l)).includes(search))
      .sort((a,b)=>Number(lineFav.includes('int:'+b.idRota))-Number(lineFav.includes('int:'+a.idRota)));
    output+='<h3 class="bus-line-group">Internos <small>Campus UFMG · '+internal.length+' linhas</small></h3>';
    output+=internal.map(l=>{
      const hs=l.horarios.map(hm).sort((a,b)=>a-b),next=live?hs.find(x=>x>=n):hs[0];
      const row='<button class="row" style="--c:'+l.corHex+'" data-line="'+esc(l.idRota)+'"><span class="num" style="background:'+l.corHex+'">'+
        esc(l.linha)+'</span><span class="info"><b>'+esc(title(l))+'</b><small>'+esc(variant(l))+
        '</small></span><span class="eta"><b>'+(next===undefined?'—':fm(next))+'</b><small>'+
        (next===undefined?'sem saídas':'próxima saída')+'</small></span></button>';
      return starRow(row,'int:'+l.idRota,lineFav.includes('int:'+l.idRota),title(l),'fav-list-line');
    }).join('')||'<p class="bus-line-hint">Nenhuma linha interna corresponde à busca.</p>';
  }
  if(lineFilter!=='internal'){
    output+='<h3 class="bus-line-group">Municipais <small>BH · '+
      (externalState==='ready'?externalRoutes.length+' linhas':'horários programados')+'</small></h3>';
    if(externalState==='ready'){
      const result=externalRoutes.filter(r=>norm(r.code+' '+r.name).includes(search))
        .sort((a,b)=>Number(lineFav.includes('ext:'+b.code))-Number(lineFav.includes('ext:'+a.code)));
      const visible=externalExpanded||search?result:result.slice(0,40);
      output+=visible.map(r=>starRow('<button class="row bus-line-external" data-externo-code="'+esc(r.code)+
        '" aria-label="Abrir linha municipal '+esc(r.code)+'"><span class="bus-code">'+esc(r.code)+'</span>'+
        '<span class="info"><b>'+esc(r.name)+'</b><small>Municipal BH · GPS e horários</small></span>'+
        '<span aria-hidden="true">›</span></button>','ext:'+r.code,lineFav.includes('ext:'+r.code),
        'linha '+r.code,'fav-list-line')).join('')||
        '<p class="bus-line-hint">Nenhuma linha municipal corresponde à busca.</p>';
      if(!externalExpanded&&!search&&result.length>40)
        output+='<button class="bus-line-more" data-external-more>Mostrar todas as '+result.length+' linhas municipais</button>';
    }else{
      output+='<p class="bus-line-hint" role="status">'+(externalState==='loading'?'Carregando linhas municipais…':
        externalState==='expired'?'GTFS municipal fora da validade.':'Linhas municipais temporariamente indisponíveis.')+'</p>';
      if(externalState!=='loading')output+='<button class="bus-line-more" data-external-retry>Tentar novamente</button>';
    }
    output+='<p class="bus-line-note">Posição GPS em tempo real quando disponível; horários programados.</p>';
  }
  return output;
}

function render(){
  const fallback=!window.L?'<p class="note" role="status">Mapa indisponível nesta conexão. Você ainda pode pesquisar pontos e consultar horários; para exibir o mapa, conecte-se à internet.</p>':'';
  el.innerHTML=fallback+(view.t==='home'?home():view.t==='stop'?stopView(view.id):view.t==='line'?lineView():nearView());
  el.scrollTop=0;
}

// No celular a busca inicia acessível, com estados intermediário/recolhido/expandido sem recriar o mapa.
function syncSheet(){
  const alwaysOpen=document.body.classList.contains('no-map')||innerWidth>=760;
  const state=alwaysOpen?'full':sheetState;
  sh.classList.toggle('peek',state==='peek');
  sh.classList.toggle('full',state==='full');
  sh.classList.toggle('detail',view.t!=='home');
  sh.classList.toggle('lines-mode',tab==='linhas'&&view.t==='home');
  const expanded=state!=='peek';
  document.body.classList.toggle('lines-filter-in-sheet',
    innerWidth<760&&tab==='linhas'&&view.t==='home'&&expanded);
  el.setAttribute('aria-hidden',String(!expanded));
  for(const b of [document.getElementById('grab'),document.getElementById('sheet-toggle'),...document.querySelectorAll('[data-sheet-toggle]')].filter(Boolean)){
    b.setAttribute('aria-expanded',String(expanded));
    b.setAttribute('aria-label',state==='peek'?'Expandir painel':state==='mid'?'Expandir detalhes':'Recolher painel');
  }
  for(const t of ['pontos','linhas']){
    const b=document.getElementById('quick-'+t),active=tab===t;
    b.classList.toggle('on',active);
    b.setAttribute('aria-pressed',String(active));
  }
}
function setSheetState(next){
  if(document.body.classList.contains('no-map')||innerWidth>=760)next='full';
  if(next==='peek' && el.contains(document.activeElement))(document.querySelector('[data-sheet-toggle]')||document.getElementById('sheet-toggle'))?.focus();
  sheetState=next;syncSheet();
}
function setExpanded(want){setSheetState(want?'mid':'peek')}
function pickQuickTab(t){
  tab=t;
  if(view.t!=='home'){hist=[];view={t:'home'};apply();}
  else render();
  setExpanded(true);
  if(t==='linhas')void loadExternalLines();
}

// O mapa é progressivo: Leaflet local, rotas e horários disponíveis sem tiles.
let map=null,route=null,sel=null,usr=null;
const mapStatus=message=>{const n=document.getElementById('map-data-status');if(n)n.textContent=message};
function renderTransportMap(){
  if(!map||!internalPins||!municipalPins)return;
  if(mapMode==='external')map.removeLayer(internalPins);
  else if(!map.hasLayer(internalPins))internalPins.addTo(map);
  municipalPins.clearLayers();
  // Oculta o GPS na visualização Internos sem apagar a última posição.
  // Assim, ao voltar para Todos/Municipais, os ônibus reaparecem imediatamente.
  if(busPins){
    if(mapMode==='internal'&&map.hasLayer(busPins))map.removeLayer(busPins);
    else if(mapMode!=='internal'&&!map.hasLayer(busPins))busPins.addTo(map);
  }
  if(mapMode==='internal'){mapStatus('49 pontos internos · GPS disponível nos municipais');return}
  if(!externalStops){mapStatus('Municipais BH: '+(externalState==='loading'?'carregando pontos…':'dados indisponíveis'));return}
  if(map.getZoom()<12){if(busPins)busPins.clearLayers();mapStatus('Aproxime o mapa para visualizar os pontos municipais');return}
  const bounds=map.getBounds().pad(.13),center=map.getCenter();
  const nearby=Object.entries(externalStops).filter(([id,p])=>Array.isArray(p)&&
    Number.isFinite(+p[1])&&Number.isFinite(+p[2])&&bounds.contains([+p[1],+p[2]]));
  nearby.sort((a,b)=>((+a[1][1]-center.lat)**2+(+a[1][2]-center.lng)**2)-
                     ((+b[1][1]-center.lat)**2+(+b[1][2]-center.lng)**2));
  const selected=nearby.slice(0,180);
  for(const [id,p] of selected){
    L.circleMarker([+p[1],+p[2]],{radius:4.5,color:'#7556c9',
      fillColor:'#7556c9',fillOpacity:.88,weight:1.2})
      .addTo(municipalPins).bindTooltip(String(p[0]||'Ponto municipal'))
      .on('click',()=>window.parent.postMessage({type:'hub:onibus:external-stop',
        id,name:String(p[0]||'')},location.origin));
  }
  const suffix=nearby.length>selected.length?' · amplie para ver mais pontos':'';
  // Não sobrescrever uma posição GPS validada ao alternar o filtro.
  // Contar somente os veículos que permanecem dentro do mapa atual.
  const recentVisible=gpsLast&&Date.now()-gpsLast<45000&&busPins?
    busPins.getLayers().filter(layer=>layer.getLatLng&&map.getBounds().contains(layer.getLatLng())).length:0;
  mapStatus(recentVisible?'GPS ao vivo: '+recentVisible+' ônibus próximos · até 2 min':
    'UFMG + BH · '+selected.length+' pontos municipais no mapa'+suffix);
  void updateGpsNearMap(selected);
}
async function loadMapMunicipal(){
  if(externalStops)return;
  if(externalState!=='ready')await loadExternalLines();
  if(externalState!=='ready'){renderTransportMap();return}
  try{
    const [stops,patterns]=await Promise.all([
      fetch('/externo/catalog/stops.json',{cache:'force-cache'}),
      fetch('/externo/catalog/patterns.json',{cache:'force-cache'})
    ]);
    if(!stops.ok||!patterns.ok)throw Error('MISSING_GTFS_POINTS');
    const [ss,pp]=await Promise.all([stops.json(),patterns.json()]);
    if(!ss||typeof ss!=='object'||!Array.isArray(pp))throw Error('INVALID_GTFS_POINTS');
    externalStops=ss;externalPatterns=pp;
    renderTransportMap();
    if(tab==='pontos'&&view.t==='home')render();
  }catch{externalStops=null;mapStatus('Pontos municipais temporariamente indisponíveis')}
}
async function updateGpsNearMap(marked){
  if(!map||!marked.length||!externalPatterns||!externalRoutes?.length||
     mapMode==='internal'||gpsBusy||document.hidden||
     (window.frameElement&&!window.frameElement.getClientRects().length))return;
  if(Date.now()-gpsLast<40000)return;
  const near=new Set(marked.map(x=>x[0]));
  const byId=new Map(externalRoutes.map(r=>[String(r.id),r.code]));
  const routeCodes=[];
  for(const p of externalPatterns){
    if(!p.stops?.some(id=>near.has(id)))continue;
    const code=byId.get(String(p.route));
    if(code&&/^[A-Za-z0-9_.:-]{1,70}$/.test(code)&&!routeCodes.includes(code))routeCodes.push(code);
    if(routeCodes.length>=30)break;
  }
  if(!routeCodes.length){mapStatus('Pontos municipais visíveis · sem linhas GPS nesta área');return}
  gpsBusy=true;gpsLast=Date.now();
  try{
    const local=['localhost','127.0.0.1'].includes(location.hostname);
    const endpoint=local?'/__hub_gps':'https://externo-bh-gps-free.hubufmg.workers.dev/api/gps';
    const url=new URL(endpoint,location.href);
    url.searchParams.set('source','GTFS_RT');
    url.searchParams.set('routes',routeCodes.join(','));
    const response=await fetch(url,{cache:'no-store'});
    if(!response.ok)throw Error('WORKER_UNAVAILABLE');
    const data=await response.json();
    if(data.available!==true||data.source!=='GTFS_RT'||!Array.isArray(data.records))
      throw Error('GPS_UNAVAILABLE');
    if(busPins)busPins.clearLayers();
    gpsCount=0;const now=Date.now(),visible=new Set(routeCodes);
    const seen=new Set();
    for(const v of data.records){
      const code=String(v.routeId||''),vehicle=String(v.vehicleId||'');
      const lat=Number(v.latitude),lon=Number(v.longitude);
      const time=Date.parse(v.lastGpsFixAt||''),age=(now-time)/1000;
      if(!visible.has(code)||!vehicle||seen.has(code+'|'+vehicle)||
        !Number.isFinite(time)||age< -60||age>120||
        !Number.isFinite(lat)||!Number.isFinite(lon)||
        lat< -20.5||lat> -19.4||lon< -44.5||lon> -43.4||
        !map.getBounds().pad(.1).contains([lat,lon]))continue;
      seen.add(code+'|'+vehicle);gpsCount++;
      const hasHeading=v.heading!==undefined&&v.heading!==null&&
        Number.isFinite(Number(v.heading));
      const angle=hasHeading?((Number(v.heading)%360)+360)%360:null;
      const rotate=angle===null?'':' style="transform:rotate('+angle+'deg)"';
      const html='<span class="gps-bus-pin"><span class="gps-bus-shape"'+rotate+'>'+"<svg viewBox=\"0 0 24 28\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><rect x=\"4\" y=\"2.5\" width=\"16\" height=\"23\" rx=\"4\" fill=\"#fff\"/><rect x=\"6.4\" y=\"5.3\" width=\"11.2\" height=\"7.3\" rx=\"2\" fill=\"#087d69\"/><path d=\"M7 15.3h10v4H7z\" fill=\"#b1e8d9\"/><circle cx=\"7.5\" cy=\"22\" r=\"1.5\" fill=\"#087d69\"/><circle cx=\"16.5\" cy=\"22\" r=\"1.5\" fill=\"#087d69\"/></svg>"+
        '</span><span class="gps-bus-code">'+esc(code)+'</span></span>';
      L.marker([lat,lon],{icon:L.divIcon({className:'',html,
        iconSize:[46,43],iconAnchor:[23,21]})}).addTo(busPins)
        .bindTooltip('Ônibus municipal '+code+' · GPS oficial · '+Math.round(age)+
          ' s atrás'+(angle===null?' · direção não informada':''));
    }
    mapStatus(gpsCount?
      'GPS ao vivo: '+gpsCount+' ônibus próximos · atualizado agora':
      'Sem posições GPS recentes nesta área · horários por tabela');
  }catch{mapStatus('GPS temporariamente indisponível · pontos e horários acessíveis')}
  finally{gpsBusy=false}
}
function changeMapMode(mode){
  if(!FILTER_MODES.includes(mode))return;
  const focusWasLine=document.activeElement?.hasAttribute('data-line-filter-toggle');
  mapMode=mode;lineFilter=mode;
  const button=document.getElementById('map-filter-toggle');
  button.dataset.currentFilter=mode;button.title=filterHint('mapa',mode);
  button.setAttribute('aria-label',button.title);
  document.getElementById('map-filter-label').textContent=FILTER_LABELS[mode];
  renderTransportMap();
  if(view.t==='home')render();
  if(focusWasLine)el.querySelector('[data-line-filter-toggle]')?.focus();
  if(mode!=='internal')void loadMapMunicipal();
}
document.getElementById('map-filter-toggle').addEventListener('click',()=>{
  changeMapMode(nextFilter(mapMode));
});
if(window.L){
  map=L.map('map',{zoomControl:false}).setView([-19.8695,-43.9675],15);
  L.control.zoom({position:'topright'}).addTo(map);
  // Tiles: apenas viewport atual, sem pré-busca/offline (política OSM).
  // Mesmo que a rede de tiles falhe, os vetores locais permanecem no mapa.
  const basemapNotice=document.getElementById('map-basemap-notice');
  let tileFailures=0;
  const tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" rel="noopener noreferrer">OpenStreetMap contributors</a> · dados: internorotas/ufmg (MIT)'
  }).addTo(map);
  tiles.on('tileload',()=>{tileFailures=0;basemapNotice.hidden=true});
  tiles.on('tileerror',()=>{if(++tileFailures>=2)basemapNotice.hidden=false});
  window.addEventListener('offline',()=>{basemapNotice.hidden=false;});
  window.addEventListener('online',()=>{
    tileFailures=0;
    tiles.redraw();
  });
  route=L.layerGroup().addTo(map);sel=L.layerGroup().addTo(map);usr=L.layerGroup().addTo(map);
  internalPins=L.layerGroup().addTo(map);municipalPins=L.layerGroup().addTo(map);busPins=L.layerGroup().addTo(map);
  // Todas as 49 paradas, inclusive a Escola de Música (Ida), compartilham
  // exatamente o mesmo raio e cores. A categoria não altera o desenho.
  D.paradas.forEach(p=>{
    L.circleMarker(p.coordenadas,{
      radius:7,
      color:'#334155',
      weight:2.5,
      fillColor:'#ffffff',
      fillOpacity:1,
      opacity:1,
      className:'interno-stop'
    }).addTo(internalPins).bindTooltip(stopName(p)).on('click',()=>go({t:'stop',id:p.idParada}));
  });
  // O iframe pode ficar oculto ao alternar abas; recalcular somente quando seu
  // contêiner mudar de tamanho, sem recriar o mapa nem alterar o zoom.
  let invalidateRaf=0;
  const invalidateMap=()=>{
    if(invalidateRaf)return;
    invalidateRaf=requestAnimationFrame(()=>{
      invalidateRaf=0;
      map.invalidateSize({pan:false});
    });
  };
  window.addEventListener('message',e=>{
    if(e.origin!==window.location.origin || !e.data || e.data.type!=='bandeco:interno:shown')return;
    invalidateMap();
    if(externalStops&&mapMode!=='internal'){
      // Voltou à aba Ônibus: consultar posição atual em vez de esperar 45 s.
      gpsLast=0;
      requestAnimationFrame(renderTransportMap);
    }
  });
  map.on('moveend zoomend',()=>renderTransportMap());
  window.addEventListener('resize',invalidateMap,{passive:true});
  if(typeof ResizeObserver==='function')new ResizeObserver(invalidateMap).observe(document.documentElement);
}else{
  document.body.classList.add('no-map');
}
function focus(pts){if(!map)return;const m=innerWidth<760;
  // Considerar a altura final do painel, inclusive durante a animacao de abertura.
  const covered=m?(sh.classList.contains('peek')?108:sh.classList.contains('full')?Math.round(innerHeight*.82):Math.round(Math.min(innerHeight*(view.t==='home'?.42:.55),view.t==='home'?360:480))):0;
  map.fitBounds(L.latLngBounds(pts),{maxZoom:17,paddingTopLeft:[m?20:375,60],paddingBottomRight:[20,covered+24]})}
function select(id){if(!sel)return;sel.clearLayers();L.circleMarker(S[id].coordenadas,{radius:14,color:'#2e90fa',weight:4,fill:false,interactive:false}).addTo(sel)}
function apply(){if(route)route.clearLayers();if(sel)sel.clearLayers();
  if(view.t!=='home')setExpanded(true);else syncSheet();
  render();
  if(view.t==='stop'){select(view.id);focus([S[view.id].coordenadas])}
  if(view.t==='line'){const l=byId(view.id);
    if(route){L.polyline(l.coordenadasTrajeto,{color:l.corHex,weight:6,opacity:.9}).addTo(route);
      l.itinerarioParadasIds.forEach(i=>L.circleMarker(S[i].coordenadas,{radius:5,color:l.corHex,weight:3,fillColor:'#fff',fillOpacity:1,interactive:false}).addTo(route));}
    if(view.focus)select(view.focus);focus(l.coordenadasTrajeto)}
  el.scrollTop=0;const f=el.querySelector('.foc');if(f)f.scrollIntoView({block:'nearest'})}
function go(v){hist.push(view);view=v;apply()}

function locate(){go({t:'near'});near={s:'loading'};render();
  if(!navigator.geolocation){near={s:'err',m:'Seu navegador não oferece localização.'};return render()}
  navigator.geolocation.getCurrentPosition(pos=>{const la=pos.coords.latitude,ln=pos.coords.longitude;
    if(usr){usr.clearLayers();L.circleMarker([la,ln],{radius:8,color:'#fff',weight:3,fillColor:'#2e90fa',fillOpacity:1,interactive:false}).addTo(usr);}
    const served=new Set(lines().flatMap(l=>Object.keys(offs(l))));
    const list=D.paradas.filter(p=>!served.size||served.has(p.idParada)).map(p=>({p,d:hav(la,ln,p.coordenadas[0],p.coordenadas[1])})).sort((a,b)=>a.d-b.d).slice(0,4);
    near={s:'ok',list};render();select(list[0].p.idParada);focus([[la,ln],list[0].p.coordenadas])},
  ()=>{near={s:'err',m:'Permita o acesso à localização no navegador ou busque o ponto pelo nome. Em arquivo aberto direto do computador, alguns navegadores bloqueiam a localização.'};render()},
  {enableHighAccuracy:true,timeout:10000,maximumAge:30000})}

el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.sheetToggle!==undefined){setSheetState(sh.classList.contains('peek')?'mid':sh.classList.contains('full')?'peek':'full');}
  else if(d.stop)go({t:'stop',id:d.stop});
  else if(d.line)go({t:'line',id:d.line,focus:d.focus});
   else if(d.extStop)window.parent.postMessage({type:'hub:onibus:external-stop',
     id:d.extStop,name:String(externalStops?.[d.extStop]?.[0]||'')},location.origin);
  else if(d.externoCode)window.parent.postMessage({type:'hub:onibus:external-line',code:d.externoCode},window.location.origin);
  else if(d.lineFilterToggle!==undefined){changeMapMode(nextFilter(lineFilter));}
  else if(d.externalMore!==undefined){externalExpanded=true;repaintLineList()}
  else if(d.externalRetry!==undefined)void loadExternalLines(true);
  else if(d.tab){pickQuickTab(d.tab)}
  else if(d.cat){cat=d.cat;render()}
  else if(d.favStopList){fav=fav.includes(d.favStopList)?fav.filter(x=>x!==d.favStopList):
    [...fav,d.favStopList];saveFav();repaintFavorites()}
  else if(d.favListLine){lineFav=lineFav.includes(d.favListLine)?
    lineFav.filter(x=>x!==d.favListLine):[...lineFav,d.favListLine];
    saveLineFav();repaintFavorites()}
  else if(d.favExtStop){externalFav=externalFav.includes(d.favExtStop)?
    externalFav.filter(x=>x!==d.favExtStop):[...externalFav,d.favExtStop];
    saveExtFav();repaintFavorites()}
  else if(d.fav){fav=fav.includes(d.fav)?fav.filter(x=>x!==d.fav):[...fav,d.fav];saveFav();render()}
  else if(d.info!==undefined){const content=b.parentElement.querySelector('[data-info-content]'),open=content?.hidden===true;if(content){content.hidden=!open;b.setAttribute('aria-expanded',String(open));}}
  else if(d.back!==undefined){view=hist.pop()||{t:'home'};apply()}
  else if(d.home!==undefined){hist=[];view={t:'home'};tab='pontos';apply()}});
el.addEventListener('input',e=>{
  if(e.target.id==='q'){q=e.target.value;document.getElementById('list').innerHTML=stopsList()}
  else if(e.target.id==='line-q'){lineQuery=e.target.value;externalExpanded=false;repaintLineList()}
});
window.addEventListener('message',e=>{
  if(e.origin!==window.location.origin||e.source!==window.parent)return;
  if(e.data?.type==='hub:onibus:resume-lines'){
    syncSharedExternal();
    if(tab!=='linhas')pickQuickTab('linhas');
    else if(view.t==='home')repaintFavorites();
  }
});
document.getElementById('loc').addEventListener('click',locate);
// Atualizar horários apenas quando necessários, preservando foco, busca e popovers.
setInterval(()=>{
  if(document.hidden || (window.frameElement && !window.frameElement.getClientRects().length))return;
  if(el.contains(document.activeElement))return;
  if(view.t==='home')return;
  const scroll=el.scrollTop;
  render();
  el.scrollTop=scroll;
},30000);
for(const id of ['grab','sheet-toggle'])document.getElementById(id).addEventListener('click',()=>setSheetState(sh.classList.contains('peek')?'mid':sh.classList.contains('full')?'peek':'full'));
for(const t of ['pontos','linhas'])document.getElementById('quick-'+t).addEventListener('click',()=>pickQuickTab(t));
// Deslizar sobre a cabecalho abre/fecha; rolagem da lista e gestos no mapa continuam nativos.
let gestureStart=null;
const head=document.getElementById('sheet-head');
head.addEventListener('touchstart',e=>{if(e.touches.length===1)gestureStart=e.touches[0].clientY},{passive:true});
head.addEventListener('touchend',e=>{
  if(gestureStart===null||!e.changedTouches.length)return;
  const delta=e.changedTouches[0].clientY-gestureStart;gestureStart=null;
  if(delta< -35)setExpanded(true);
  else if(delta>35)setExpanded(false);
},{passive:true});
let detailGesture=false;
el.addEventListener('touchstart',e=>{detailGesture=e.touches.length===1&&!!e.target.closest('.point-detail-head');if(detailGesture)gestureStart=e.touches[0].clientY},{passive:true});
el.addEventListener('touchend',e=>{
  if(!detailGesture||gestureStart===null||!e.changedTouches.length){detailGesture=false;return;}
  const delta=e.changedTouches[0].clientY-gestureStart;gestureStart=null;detailGesture=false;
  if(delta< -35)setExpanded(true);
  else if(delta>35)setExpanded(false);
},{passive:true});
window.addEventListener('resize',syncSheet);
apply();
void loadMapMunicipal();
setInterval(()=>{
  if(!document.hidden&&(!window.frameElement||window.frameElement.getClientRects().length)&&
     mapMode!=='internal'&&externalStops&&map){
    gpsLast=0;
    const bounds=map.getBounds();
    const selected=Object.entries(externalStops).filter(([id,p])=>
      Array.isArray(p)&&bounds.contains([+p[1],+p[2]])).slice(0,180);
    void updateGpsNearMap(selected);
  }
},45000);
})();
