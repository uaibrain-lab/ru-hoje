# Implantar com: npx wrangler deploy --config worker/wrangler.toml
# Plano Workers Free, sem KV/D1/Cloud Billing no Firebase.
name = "hub-fump-proxy"
main = "fump-proxy.mjs"
compatibility_date = "2026-11-16"
workers_dev = true

# Worker executa proximo da origem no Brasil; o API da FUMP foi confirmado
# a partir do Brasil, mas respondeu 503 em acessos vindos de outros POPs.
# O posicionamento pode ser revertido se a auditoria global nao melhorar.
[placement]
region = "gcp:southamerica-east1"

# Somente UM cache de cardápios: caches.default em worker/fump-proxy.mjs.
# O cache automatico do Worker e independente da Cache API. Dois caches
# em sequencia poderiam ampliar a idade efetiva do menu apos HITs.
# Continua usando a Cache API com TTL de 60 s (positivo), 15 s (vazio),
# sem fallback stale-if-error e com validação de timestamp em cada leitura.
# Cache API local ao POP e independente da opcao abaixo.
[cache]
enabled = false

# Monitor externo à infraestrutura GitHub, no mesmo Worker gratuito.
# 08h30, 13h30, 18h30 Brasília (UTC-3), diariamente.
# Um único gatilho -> usa 1 das 5 cotas gratuitas por conta.
# Não publica resultados, não sorteia e não grava no Firestore.
[triggers]
crons = [ "30 11,16,21 * * *" ]
