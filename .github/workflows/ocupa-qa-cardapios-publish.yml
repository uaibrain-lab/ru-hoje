name: OCUPA UFMG - FUMP QA publish (manual)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Executar a atualização QA após todos os gates'
        required: true
        default: false
        type: boolean
      confirm:
        description: 'Confirmo publicação única em bandeco-homologacao'
        required: true
        default: false
        type: boolean
      auth_probe:
        description: 'Somente comprovar WIF; não coletar nem publicar'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GOOGLE_CLOUD_PROJECT: bandeco-homologacao
      GCLOUD_PROJECT: bandeco-homologacao
      OCUPA_QA_ALLOWED_REPO: uaibrain-lab/ru-hoje
      OCUPA_QA_SYNC_ENABLED: ${{ inputs.publish && inputs.confirm && 'true' || 'false' }}
      OCUPA_QA_PUBLISH_ENABLED: ${{ inputs.publish && inputs.confirm && 'true' || 'false' }}

    steps:
      - name: Validar repositório, IDs e evento
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          OWNER_ID: ${{ github.repository_owner_id }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = 'uaibrain-lab/ru-hoje'
          test "$REPOSITORY_ID" = '1425884929'
          test "$OWNER_ID" = '342577642'
          test "$REF" = 'refs/heads/main'
          test "$EVENT" = 'workflow_dispatch'

      - name: Validar contrato do auth probe
        if: ${{ inputs.auth_probe }}
        run: |
          set -euo pipefail
          test '${{ inputs.publish }}' = 'false'
          test '${{ inputs.confirm }}' = 'false'

      - name: Checkout sem persistir credenciais
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node 24
        if: ${{ !inputs.auth_probe }}
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependências do sincronizador
        if: ${{ !inputs.auth_probe }}
        working-directory: cardapios-qa
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Testes do sincronizador
        if: ${{ !inputs.auth_probe }}
        working-directory: cardapios-qa
        run: node --test tests/ocupa-qa-menu.test.mjs

      - name: Dry-run sem autenticação de escrita
        if: ${{ !inputs.publish }}
        working-directory: cardapios-qa
        run: node scripts/ocupa-qa-menu-sync.mjs --mode=dry-run --days=7

      - name: Exigir confirmação explícita
        if: ${{ !inputs.auth_probe && inputs.publish && !inputs.confirm }}
        run: |
          echo 'OCUPA_QA_PUBLISH_BLOQUEADO=CONFIRMACAO_AUSENTE'
          exit 1

      - name: Autenticar publisher QA via WIF
        if: ${{ inputs.auth_probe || (inputs.publish && inputs.confirm) }}
        uses: google-github-actions/auth@v3
        with:
          project_id: bandeco-homologacao
          workload_identity_provider: projects/342397522942/locations/global/workloadIdentityPools/ocupa-qa-publisher/providers/ocupa-qa-cardapios-publish
          service_account: ocupa-qa-cardapios-publisher@bandeco-homologacao.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false
          cleanup_credentials: true

      - name: Confirmar WIF sem dados
        if: ${{ inputs.auth_probe }}
        run: |
          set -euo pipefail
          echo 'OCUPA_P5F2A_WIF_OK=1'
          echo 'OCUPA_P5F2A_FIRESTORE_OPERACOES=0'
          echo 'OCUPA_P5F2A_SEM_PUBLICACAO=1'

      - name: Publicar uma atualização QA
        if: ${{ !inputs.auth_probe && inputs.publish && inputs.confirm }}
        working-directory: cardapios-qa
        env:
          OCUPA_QA_BACKUP_DIR: ${{ runner.temp }}/ocupa-qa-backup
        run: node scripts/ocupa-qa-menu-sync.mjs --mode=apply --days=7 --ack=PUBLICAR_SOMENTE_OCUPA_QA
