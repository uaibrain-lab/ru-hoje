name: Hub UFMG — sincronização FUMP produção

run-name: "FUMP sync | ${{ github.event_name }} | ${{ inputs.mode || 'apply' }} | ${{ inputs.recovery && 'WATCHDOG_RECOVERY' || 'normal' }}"

on:
  # Publicar somente os arquivos do Hub após mudanças do PWA aprovadas na main.
  push:
    branches: [main]
    paths:
      - 'public/assets/app.js'
      - 'public/assets/fump-live.js'
      - 'public/assets/fump-parse.js'
      - 'public/index.html'
      - 'public/service-worker.js'
  # UTC, em minutos pouco concorridos e em varios periodos do dia.
  schedule:
    - cron: '41 8,12,16,20 * * 1-5'
    - cron: '41 13,18 * * 6'
    - cron: '41 16 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo da execução administrativa'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - collect
          - apply
      recovery:
        description: 'Execução automática de recuperação pelo watchdog'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: hub-production-menu-writer
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GCLOUD_PROJECT: hubufmg
      GOOGLE_CLOUD_PROJECT: hubufmg
      HUB_PROD_SYNC_ENABLED: "${{ vars.HUB_PROD_SYNC_ENABLED || 'false' }}"
      HUB_PROD_PUBLISH_ENABLED: "${{ vars.HUB_PROD_PUBLISH_ENABLED || 'false' }}"
      HUB_PROD_BACKUP_DIR: /tmp/hub-prod-backup
      FUMP_PUBLIC_PROXY_URL: "${{ vars.FUMP_PUBLIC_PROXY_URL || 'https://hub-fump-proxy.hubufmg.workers.dev' }}"
      FUMP_RELAY_URL: "${{ vars.FUMP_RELAY_URL || '' }}"
      FUMP_RELAY_TOKEN: "${{ secrets.FUMP_RELAY_TOKEN || '' }}"
      HUB_PROD_MODE: "${{ github.event.inputs.mode || 'apply' }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/858219271468/locations/global/workloadIdentityPools/hub-prod-actions/providers/hub-prod-sync
          service_account: hub-prod-sync@hubufmg.iam.gserviceaccount.com
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Consultar FUMP com retentativas e confirmar publicacao
        run: bash scripts/hub-production-scheduled-run.sh

  publish-hosting:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'uaibrain-lab/ru-hoje' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Garantir projeto de destino e limites do deploy
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = 'uaibrain-lab/ru-hoje'
          test "${GITHUB_REF}" = 'refs/heads/main'
          grep -q 'firebaseProjectId: "hubufmg"' public/config.js
          test -f firebase.json
      - name: Testes de regressão
        run: npm ci --no-audit --no-fund && npm test
      - name: Validar navegação e consulta FUMP no navegador
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/858219271468/locations/global/workloadIdentityPools/hub-prod-actions/providers/hub-prod-sync
          service_account: hub-prod-sync@hubufmg.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Publicar somente Firebase Hosting do projeto hubufmg
        run: npx --yes firebase-tools@15.22.1 deploy --only hosting --project hubufmg --non-interactive
      - name: Verificar conteúdo no domínio publicado
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 'https://hubufmg.web.app/assets/fump-live.js' | grep -q 'readLiveMenu'
          curl -fsSL --retry 3 --retry-delay 5 'https://hubufmg.web.app/assets/fump-parse.js' | grep -q 'parseMenuJson'
          echo 'HUB_HOSTING_LIVE_RELEASE_CONFIRMED=1'

  incident:
    needs: sync
    if: "${{ always() && (github.event_name == 'schedule' || github.event.inputs.mode == 'apply') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Registrar ou encerrar alerta da sincronizacao principal
        env:
          GH_TOKEN: "${{ github.token }}"
          HUB_INCIDENT_LABEL: principal
          HUB_INCIDENT_STATUS: "${{ needs.sync.result == 'success' && 'success' || 'failure' }}"
        run: bash scripts/hub-sync-incident.sh
