name: Hub UFMG — sincronização FUMP produção

on:
  # UTC, em minutos pouco concorridos e em varios periodos do dia.
  schedule:
    - cron: '41 8,12,16,20 * * 1-5'
    - cron: '41 13,18 * * 6'
    - cron: '41 16 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo da execução administrativa'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - collect
          - apply

permissions:
  contents: read
  id-token: write

concurrency:
  group: hub-production-menu-writer
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GCLOUD_PROJECT: hubufmg
      GOOGLE_CLOUD_PROJECT: hubufmg
      HUB_PROD_SYNC_ENABLED: "${{ vars.HUB_PROD_SYNC_ENABLED || 'false' }}"
      HUB_PROD_PUBLISH_ENABLED: "${{ vars.HUB_PROD_PUBLISH_ENABLED || 'false' }}"
      HUB_PROD_BACKUP_DIR: /tmp/hub-prod-backup
      HUB_PROD_MODE: "${{ github.event.inputs.mode || 'apply' }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/858219271468/locations/global/workloadIdentityPools/hub-prod-actions/providers/hub-prod-sync
          service_account: hub-prod-sync@hubufmg.iam.gserviceaccount.com
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Consultar FUMP com retentativas e confirmar publicacao
        run: bash scripts/hub-production-scheduled-run.sh

  incident:
    needs: sync
    if: "${{ always() && (github.event_name == 'schedule' || github.event.inputs.mode == 'apply') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Registrar ou encerrar alerta da sincronizacao principal
        env:
          GH_TOKEN: "${{ github.token }}"
          HUB_INCIDENT_LABEL: principal
          HUB_INCIDENT_STATUS: "${{ needs.sync.result == 'success' && 'success' || 'failure' }}"
        run: bash scripts/hub-sync-incident.sh
