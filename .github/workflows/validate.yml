name: Validar projeto
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/hub-refresh-regression.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: bash -n scripts/hub-production-scheduled-run.sh scripts/hub-production-watchdog.sh scripts/hub-sync-incident.sh scripts/hub-production-raffle-alert.sh scripts/hub-production-raffle-watchdog.sh
      - run: node scripts/fump-window-classification-sweep.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fump-classification-audit
          path: audit-results/fump-window-classification.json
          if-no-files-found: warn
      - run: npm test
      - run: npm run test:e2e
      - run: node --check public/assets/app.js && node --check public/service-worker.js && node --check scripts/sync.mjs && node --check scripts/publish.mjs && node --check cardapios-qa/scripts/ocupa-qa-api-monitor.mjs && bash -n scripts/fump-network-diagnostics.sh
