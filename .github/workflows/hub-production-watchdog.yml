name: Hub UFMG — monitor de atualização automática

on:
  # Cardapios atualizados sob demanda pelo navegador via Cloudflare Worker.
  # Coleta administrativa permanece disponivel por workflow_dispatch.
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: hub-production-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: "${{ github.token }}"
      HUB_PROD_SYNC_ENABLED: "${{ vars.HUB_PROD_SYNC_ENABLED || 'false' }}"
      HUB_PROD_PUBLISH_ENABLED: "${{ vars.HUB_PROD_PUBLISH_ENABLED || 'false' }}"
    steps:
      - uses: actions/checkout@v4
      - name: Detectar atrasos e tentar recuperacao
        run: bash scripts/hub-production-watchdog.sh
