name: Hub UFMG — monitor de atualização automática

on:
  schedule:
    # Vigilância contínua diária; minuto fora do início da hora para reduzir atrasos.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: hub-production-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: "${{ github.token }}"
      HUB_PROD_SYNC_ENABLED: "${{ vars.HUB_PROD_SYNC_ENABLED || 'false' }}"
      HUB_PROD_PUBLISH_ENABLED: "${{ vars.HUB_PROD_PUBLISH_ENABLED || 'false' }}"
    steps:
      - uses: actions/checkout@v4
      - name: Detectar atrasos e tentar recuperacao
        run: bash scripts/hub-production-watchdog.sh
