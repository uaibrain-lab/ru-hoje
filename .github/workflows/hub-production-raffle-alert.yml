name: Hub UFMG — alerta de apuração automática
on:
  schedule:
    # 19h15 e 19h45 (Brasília), quarta a sexta. Monitor SOMENTE leitura.
    # O sorteio continua agendado apenas às 18h10 no workflow separado.
    - cron: '15 22 * * 3-5'
    - cron: '45 22 * * 3-5'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: hub-production-raffle-alert
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HUB_PROD_RAFFLES_ENABLED: ${{ vars.HUB_PROD_RAFFLES_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir somente execução agendada e abrir/fechar alerta
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/hub-production-raffle-alert.sh
