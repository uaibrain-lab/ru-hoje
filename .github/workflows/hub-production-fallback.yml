name: Hub UFMG — sincronização FUMP redundante

on:
  schedule:
    - cron: '23 10,14,18,22 * * 1-5'
    - cron: '23 15,20 * * 6'
    - cron: '23 19 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: hub-production-menu-writer
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GCLOUD_PROJECT: hubufmg
      GOOGLE_CLOUD_PROJECT: hubufmg
      HUB_PROD_SYNC_ENABLED: "${{ vars.HUB_PROD_SYNC_ENABLED || 'false' }}"
      HUB_PROD_PUBLISH_ENABLED: "${{ vars.HUB_PROD_PUBLISH_ENABLED || 'false' }}"
      HUB_PROD_BACKUP_DIR: /tmp/hub-prod-backup
      HUB_PROD_MODE: apply
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/858219271468/locations/global/workloadIdentityPools/hub-prod-actions/providers/hub-prod-refresh
          service_account: hub-prod-refresh@hubufmg.iam.gserviceaccount.com
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Consulta de contingencia a FUMP
        run: bash scripts/hub-production-scheduled-run.sh

  incident:
    needs: sync
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Registrar ou encerrar alerta da sincronizacao redundante
        env:
          GH_TOKEN: "${{ github.token }}"
          HUB_INCIDENT_LABEL: redundante
          HUB_INCIDENT_STATUS: "${{ needs.sync.result == 'success' && 'success' || 'failure' }}"
        run: bash scripts/hub-sync-incident.sh
