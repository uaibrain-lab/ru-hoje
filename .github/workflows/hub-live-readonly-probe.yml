name: Hub UFMG - auditoria de dados ao vivo (somente leitura)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/hub-live-readonly-probe.mjs'
      - '.github/workflows/hub-live-readonly-probe.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirmar leitura sem escrita
        run: node scripts/hub-live-readonly-probe.mjs
