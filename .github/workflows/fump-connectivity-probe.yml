name: FUMP API connectivity probe (read-only)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fump-connectivity-probe.yml'
      - 'scripts/fump-connectivity-probe.mjs'
      - 'scripts/fump-network-diagnostics.sh'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Diagnosticar DNS, IPv4/IPv6, TCP e TLS diretamente na FUMP
        continue-on-error: true
        run: bash scripts/fump-network-diagnostics.sh
      - name: Instalar Chromium
        run: npx playwright install chromium
      - name: Testar FUMP por Node e Chromium (somente leitura)
        run: node scripts/fump-connectivity-probe.mjs
