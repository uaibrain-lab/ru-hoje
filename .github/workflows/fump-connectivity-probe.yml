name: FUMP API connectivity probe (read-only)

on:
  pull_request:
    paths:
      - 'scripts/fump-connectivity-probe.mjs'
      - '.github/workflows/fump-connectivity-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Instalar Chromium
        run: npx playwright install chromium
      - name: Testar FUMP por Node e Chromium (somente leitura)
        run: node scripts/fump-connectivity-probe.mjs
