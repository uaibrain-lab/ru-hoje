name: Hub UFMG — executor de sorteios produção

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: hub-production-raffles
  cancel-in-progress: false

jobs:
  raffle:
    if: vars.HUB_PROD_RAFFLES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HUB_PROD_PROJECT_ID: hubufmg
      HUB_PROD_RAFFLES_ENABLED: ${{ vars.HUB_PROD_RAFFLES_ENABLED || 'false' }}
      HUB_PROD_WIF_PROVIDER: projects/858219271468/locations/global/workloadIdentityPools/hub-prod-actions/providers/hub-prod-raffles
      HUB_PROD_SERVICE_ACCOUNT: hub-prod-raffles@hubufmg.iam.gserviceaccount.com
      HUB_PROD_PRIVATE_KEY_JWK: ${{ secrets.HUB_PROD_PRIVATE_KEY_JWK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/858219271468/locations/global/workloadIdentityPools/hub-prod-actions/providers/hub-prod-raffles
          service_account: hub-prod-raffles@hubufmg.iam.gserviceaccount.com
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: node scripts/run-raffles-production.mjs --commit
