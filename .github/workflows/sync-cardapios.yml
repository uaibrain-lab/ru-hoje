name: Sincronizar cardápios FUMP (CATM UFMG)
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Quantidade de dias para consultar via API (1 a 3)'
        type: choice
        options: ['1', '2', '3']
        default: '3'
        required: true
      publish:
        description: 'Publicar no Firestore? Somente APÓS autorização explícita'
        type: boolean
        default: false
        required: true
  schedule:
    # Brasília UTC-3, segunda a sábado: 07h23, 12h23, 14h43, 16h23.
    - cron: '23 10,15,19 * * 1-6'
    - cron: '43 17 * * 1-6'
permissions:
  contents: read
concurrency:
  group: ru-hoje-sync
  cancel-in-progress: false
jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.RU_SYNC_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    # Não gasta minutos no agendamento enquanto publicação automática estiver desligada.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Validar parser e regras de consolidação
        run: npm test
      - name: Coletar JSON diretamente da API oficial da FUMP
        env:
          DAYS: ${{ github.event.inputs.days || '3' }}
        run: node scripts/sync-api.mjs --days "$DAYS"
      - name: Auditar respostas brutas e candidato
        run: node scripts/prepare-api-snapshot.mjs --require-today
      - name: Rejeitar solicitação de publicação não autorizada
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && vars.RU_SYNC_PUBLISH_ENABLED != 'true' }}
        run: |
          echo 'Publicação bloqueada: RU_SYNC_PUBLISH_ENABLED não está true.'
          exit 1
      - name: Preparar arquivo temporário para publicação
        if: ${{ vars.RU_SYNC_PUBLISH_ENABLED == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.publish == true) || github.event_name == 'schedule') }}
        run: node scripts/prepare-api-snapshot.mjs --require-today --out public/data/cardapios.json --stage-local-json
      - name: Verificar credencial de publicação
        if: ${{ vars.RU_SYNC_PUBLISH_ENABLED == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.publish == true) || github.event_name == 'schedule') }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/check-config.mjs
      - name: Publicar dados auditados no Firestore (não faz deploy Hosting)
        if: ${{ vars.RU_SYNC_PUBLISH_ENABLED == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.publish == true) || github.event_name == 'schedule') }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/publish.mjs
      - name: Guardar diagnóstico da API
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fump-api-sincronizacao
          path: diagnostics/fump-api/
          if-no-files-found: ignore
          retention-days: 7
